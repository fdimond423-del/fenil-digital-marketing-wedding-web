  <title>Wedding Celebration</title>

<body>

  <!-- Loader -->
  <div id="loader" aria-hidden="true">
    <p class="loader-names" data-couple></p>
    <p class="loader-text">Loading your invitation</p>
    <div class="loader-bar"></div>
  </div>

  <!-- Envelope entry -->
  <div id="entry" class="entry" role="button" tabindex="0" aria-label="Tap to open the invitation">
    <div class="env-back"></div>
    <div class="env-letter"><span class="env-letter-small">Together with their families</span><span class="env-letter-names" data-couple></span></div>
    <div class="env-front"></div>
    <div class="env-flap"><div class="flap-face"></div></div>
    <p class="env-tap">Tap to Open</p>
    <div class="env-seal"><span class="env-seal-text"></span></div>
    <p class="env-message"></p>
  </div>

  <canvas id="petals" aria-hidden="true"></canvas>

  <main id="main">
    <section id="hero"></section>
    <section id="date-section"></section>

    <div id="locked" hidden>
      <section id="countdown-section"></section>
      <section id="story-section"></section>
      <section id="venue-section"></section>
      <section id="events-section"></section>
      <section id="rsvp-section"></section>
      <footer id="footer-section"></footer>
    </div>
  </main>

  <audio id="bg-audio" loop preload="auto"></audio>
  <button type="button" id="music-btn" aria-label="Pause music" hidden>
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>

  </button>
