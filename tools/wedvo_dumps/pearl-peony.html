<style>
:root{
  --paper:#f3eee4; --ink:#2f3a2f; --green:#2d4a35; --sage:#7d927a; --sage-d:#64795f; --line:#b9b19f;
  --soft:#6d6a60; --pearl:#fbf8f1;
  --ar:'Amiri',serif; --ar-cal:'Aref Ruqaa',serif;

}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{min-height:100svh;background:var(--paper) url(assets/paper.webp) center top/384px auto repeat;color:var(--ink);font-family:var(--ar);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ================= الظرف ================= */
#coverScreen{position:fixed;inset:0;z-index:50;overflow:hidden;background:#efe8da;cursor:pointer;outline:none}
#coverScreen.gone{display:none}
.cv{position:absolute;left:50%;top:50%;width:max(100vw,51.84svh);aspect-ratio:564/1088;transform:translate(-50%,-50%);container-type:inline-size}
@media (min-width:560px){.cv{width:max(min(100vw,500px),51.84svh)}}
.cv-bg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .9s ease .35s}
.cv-txt{position:absolute;left:0;right:0;text-align:center;color:var(--ink);transition:opacity .5s ease}
.cv-top{top:19%;font-size:4.6cqw;line-height:1.6}
.cv-hint{top:79%;font-size:4.9cqw;font-weight:700}
[dir=ltr] .cv-hint{font-family:var(--lat);font-weight:600;font-size:5.2cqw;letter-spacing:.02em}
[dir=ltr] .cv-top{font-family:var(--lat);font-size:4.8cqw;font-weight:500;top:18%;line-height:1.5}
.cv-hint .orn{width:34cqw;margin:1.2cqw auto 0}
.env{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;will-change:transform}

.env-names{top:30.2%;font-weight:700;font-family:var(--ar-cal);font-size:calc(10.4cqw*var(--fit,1));line-height:1.3;color:#1f3a28;white-space:nowrap;padding:0 14cqw}
[dir=ltr] .env-names{font-family:var(--lat-cal);font-weight:400;font-size:calc(9.6cqw*var(--fit,1));top:30.6%}
.env-orn{top:38.4%;width:22cqw;left:50%;right:auto;transform:translateX(-50%)}
.env-date{top:41.4%;font-variant-numeric:lining-nums;font-family:var(--lat);font-size:3.9cqw;letter-spacing:.12em;color:#3b3f37;font-weight:500}
.seal-glow{position:absolute;left:49.6%;top:53.6%;width:22cqw;height:22cqw;border-radius:50%;transform:translate(-50%,-50%) scale(.6);
  background:radial-gradient(circle,rgba(255,250,235,.95),rgba(255,246,220,0) 68%);opacity:0;pointer-events:none}
.seal-hit{position:absolute;left:49.6%;top:53.6%;width:23cqw;height:23cqw;border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto}
.cv-pulse .seal-glow{animation:sealPulse 2.6s ease-in-out 1.2s infinite}
.seal-ring{position:absolute;left:49.6%;top:53.6%;width:23cqw;height:23cqw;border-radius:50%;border:.5cqw solid rgba(255,250,236,.85);transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none}
.cv-pulse .seal-ring{animation:ring 2.6s ease-out 1.6s infinite}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.85)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}
@keyframes sealPulse{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}50%{opacity:.55;transform:translate(-50%,-50%) scale(1.05)}}

/* الفتح: الختم يلمع ← الظرف ينزل لتحت ← الخلفية تختفي */
#coverScreen.opening .seal-glow{animation:sealOpen .7s ease-out forwards}
@keyframes sealOpen{0%{opacity:.2;transform:translate(-50%,-50%) scale(.7)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
#coverScreen.opening .env{animation:envDrop 1.35s cubic-bezier(.5,-.12,.72,.22) .32s forwards}
@keyframes envDrop{0%{transform:translateY(0) rotate(0) scale(1)}10%{transform:translateY(.4%) rotate(0) scale(.985)}100%{transform:translateY(118%) rotate(5deg) scale(.96)}}
#coverScreen.opening .cv-bg{opacity:0}
#coverScreen.opening .cv-txt{opacity:0}
#coverScreen.opening{background:transparent}

/* ================= الدعوة ================= */
#inv{position:relative;width:min(100%,480px);margin:0 auto;container-type:inline-size;overflow:hidden;padding-bottom:0}
#inv::before,#inv::after{content:"";position:absolute;top:0;bottom:0;width:22px;pointer-events:none;z-index:4}

@media (min-width:520px){
  html{background:#e9e2d4}
  #inv{box-shadow:0 0 0 1px rgba(160,150,125,.18),0 30px 80px rgba(90,80,60,.16)}
}
.sec{position:relative;text-align:center;padding:0 9cqw;z-index:2}
.sec>*{position:relative;z-index:3}
.t{color:var(--ink)}
.h{font-weight:700;color:var(--green);font-size:9.4cqw;line-height:1.45}
.p{font-size:4.75cqw;line-height:1.9;color:#34392f}
.small{font-size:3.7cqw}
[dir=ltr] .h{font-family:var(--lat);font-weight:600;font-size:9.4cqw;line-height:1.15;letter-spacing:.01em}
[dir=ltr] .p{font-family:var(--lat);font-size:4.9cqw;line-height:1.6;font-weight:500}
.orn{display:block;width:40cqw;height:auto;margin:3.2cqw auto;color:var(--sage)}
.orn.sm{width:30cqw}
.orn.wide{width:62cqw}

/* الورد: غلاف للبارالاكس ← ظهور ← تمايل */
.fl{position:absolute;z-index:1;pointer-events:none}
.fl>.rv{width:100%;height:100%;opacity:0;transform:scale(.9) translate(var(--fx,0),var(--fy,0));filter:blur(5px);
  transition:opacity 1.6s ease,transform 2s cubic-bezier(.2,.8,.2,1),filter 1.6s ease;transform-origin:var(--o,50% 50%)}
.fl.in>.rv{opacity:1;transform:none;filter:none}
.fl img{width:100%;height:auto;transform-origin:var(--o,50% 50%);animation:sway var(--sd,7s) ease-in-out var(--sl,0s) infinite alternate;
  filter:drop-shadow(0 .8cqw 1.2cqw rgba(70,60,40,.16))}
@keyframes sway{from{transform:rotate(calc(var(--sw,1.4deg)*-1))}to{transform:rotate(var(--sw,1.4deg))}}
.emb{position:absolute;z-index:0;pointer-events:none;opacity:.9}
.fade-b img{-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 99%);mask-image:linear-gradient(to bottom,#000 72%,transparent 99%)}
.fade-t img{-webkit-mask-image:linear-gradient(to top,#000 72%,transparent 99%);mask-image:linear-gradient(to top,#000 72%,transparent 99%)}

/* ظهور الكلام مع السكرول */
.r{opacity:0;transform:translateY(5cqw);transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.r.in{opacity:1;transform:none}
.r.d1{transition-delay:.12s}.r.d2{transition-delay:.24s}.r.d3{transition-delay:.36s}.r.d4{transition-delay:.48s}.r.d5{transition-delay:.6s}

/* 1) الافتتاحية */
.s-intro{padding-top:46cqw;padding-bottom:6cqw}
.bism{font-size:4.9cqw;color:#3a3f36;margin-bottom:6.5cqw}
.names{font-family:var(--ar-cal);font-weight:700;font-size:calc(17cqw*var(--fit,1));white-space:nowrap;line-height:1.5;color:#1d3a26;margin:3cqw -9cqw 0;padding:0 9cqw;
  -webkit-mask-image:linear-gradient(to left,#000 45%,transparent 55%);mask-image:linear-gradient(to left,#000 45%,transparent 55%);
  -webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:0 0;mask-position:0 0;transition:-webkit-mask-position 2.4s cubic-bezier(.45,.05,.25,1) .2s,mask-position 2.4s cubic-bezier(.45,.05,.25,1) .2s}
.names.r{transform:none}
.names.in{-webkit-mask-position:100% 0;mask-position:100% 0}
[dir=ltr] .names{font-family:var(--lat-cal);font-size:calc(13.4cqw*var(--fit,1));line-height:1.45;white-space:nowrap;
  -webkit-mask-image:linear-gradient(to right,#000 45%,transparent 55%);mask-image:linear-gradient(to right,#000 45%,transparent 55%);-webkit-mask-position:100% 0;mask-position:100% 0}
[dir=ltr] .names.in{-webkit-mask-position:0 0;mask-position:0 0}
.pp-par{display:flex;justify-content:center;gap:5cqw;margin:5.5cqw auto 0;max-width:86cqw}
.pp-par>div{flex:1;min-width:0}
.pp-par>div+div{border-left:1px solid rgba(44,58,47,.25);padding-left:5cqw}
.pp-par.one>div+div{border:0;padding:0}
.pp-par span{display:block;font-family:var(--lat);font-size:2.9cqw;letter-spacing:.22em;text-transform:uppercase;color:#5d7057;margin-bottom:1.4cqw}
.pp-par b{display:block;font-family:var(--lat);font-weight:500;font-size:4.6cqw;line-height:1.35;color:#1d3a26;white-space:pre-line}
.names-lat{font-family:var(--lat);font-size:6.1cqw;letter-spacing:.14em;color:#2c3a2f;font-weight:500;margin-top:-.5cqw}
[dir=ltr] .names-lat{font-family:var(--lat);font-style:italic;letter-spacing:.04em;font-size:6cqw}
.date-line{font-size:6.2cqw;font-weight:700;color:#273a2c}
[dir=ltr] .date-line{font-family:var(--lat);letter-spacing:.06em}

/* 2) الموعد */
.s-date{padding-top:30cqw;padding-bottom:4cqw}
.big-day{font-size:30cqw;font-weight:700;line-height:1.1;color:#1f3a27;margin-top:1cqw}
[dir=ltr] .big-day{font-family:var(--lat);font-weight:500;font-size:30cqw;line-height:.9}
.month{font-size:9.4cqw;font-weight:700;line-height:1.25;color:#2a3d2e}
.year{font-size:9.4cqw;font-weight:700;line-height:1.25;color:#2a3d2e;letter-spacing:.06em}
[dir=ltr] .month,[dir=ltr] .year{font-family:var(--lat);font-weight:500}
.time{font-size:6.8cqw;font-weight:700;color:#26372a}
[dir=ltr] .time{font-family:var(--lat);font-weight:600}
.cd{display:flex;gap:3cqw;justify-content:center;margin-top:4cqw}
html[dir=ltr] .cd{flex-direction:row-reverse}
.cd>div{width:18.6cqw;height:22cqw;border:1px solid #b8b5a3;border-radius:2.6cqw;background:rgba(250,247,239,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;box-shadow:0 .5cqw 1.6cqw rgba(90,80,60,.06),inset 0 0 0 .7cqw rgba(255,255,255,.35)}
.cd b{font-variant-numeric:lining-nums;font-family:var(--lat);font-size:7.6cqw;font-weight:600;color:#26372a;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:4.1cqw;color:#4a4d44}
[dir=ltr] .cd span{font-family:var(--lat);font-size:3.9cqw;font-weight:500}
.pill{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:2.4cqw;height:12cqw;padding:0 7cqw;border-radius:99px;
  border:1px solid #9e9a88;background:rgba(251,248,241,.7);font-size:4.6cqw;font-weight:700;color:#2f3a2f;margin-top:6cqw;
  box-shadow:0 .7cqw 2cqw rgba(80,70,50,.08);transition:transform .2s,background .2s}
.pill:active{transform:scale(.96)}
.pill svg{width:5cqw;height:5cqw}
[dir=ltr] .pill{font-family:var(--lat);font-size:4.6cqw;font-weight:600}
.pill.green{background:linear-gradient(#7f957b,#677d63);border-color:#5b7058;color:#fff;box-shadow:0 1cqw 2.6cqw rgba(60,80,55,.28),inset 0 1px 0 rgba(255,255,255,.25)}

/* 3) البرنامج */
.s-prog{padding-top:24cqw;padding-bottom:16cqw}
.tl{position:relative;margin:6cqw auto 0;width:100%}
.tl::before{content:"";position:absolute;top:2cqw;bottom:2cqw;left:38%;width:1px;background:linear-gradient(#a49f8c,#a49f8c);transform-origin:top;transform:scaleY(var(--tl,0));transition:transform 2.4s cubic-bezier(.3,.6,.3,1)}
[dir=ltr] .tl::before{left:auto;right:38%}
.tl.in{--tl:1}
.ti{position:relative;display:grid;grid-template-columns:38% 62%;align-items:center;min-height:30cqw}
[dir=rtl] .ti{direction:ltr}
.ti .ic{display:flex;justify-content:center}
.ti .ic img{width:17cqw;height:auto;opacity:.92}
.ti .tx{text-align:right;padding-right:0;padding-left:8cqw;direction:rtl}
[dir=ltr] .ti{grid-template-columns:62% 38%}
[dir=ltr] .ti .ic{order:2}
[dir=ltr] .ti .tx{order:1;text-align:left;direction:ltr;padding-left:0;padding-right:8cqw}
.ti .tx b{display:block;font-size:6.6cqw;font-weight:700;color:#24372a}
[dir=ltr] .ti .tx b{font-variant-numeric:lining-nums;font-family:var(--lat);font-weight:600;font-size:6.6cqw}
.ti .tx span{display:block;font-size:4.6cqw;line-height:1.6;color:#3b3e36}
.ti .tx span{text-wrap:balance}
[dir=ltr] .ti .tx span{font-family:var(--lat);font-size:4.7cqw;font-weight:500;line-height:1.35}
.pearl{position:absolute;left:38%;top:50%;width:4.4cqw;height:4.4cqw;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle at 35% 30%,#fff 0,#fbf6ec 30%,#e6dccb 70%,#c9bca6 100%);box-shadow:0 .4cqw .9cqw rgba(80,70,50,.25);
  transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
[dir=ltr] .pearl{left:62%}
.ti.in .pearl{transform:translate(-50%,-50%) scale(1)}

/* 4) المكان */
.s-place{padding-top:18cqw;padding-bottom:8cqw}
.arch{position:relative;margin:5cqw auto 0;width:74cqw;padding:12cqw 6cqw 9cqw;border:1px solid rgba(170,160,135,.55);border-radius:37cqw 37cqw 2cqw 2cqw;
  box-shadow:inset 0 0 0 1.6cqw rgba(255,255,255,.35),inset 0 0 0 1.75cqw rgba(170,160,135,.35),0 1cqw 4cqw rgba(90,80,60,.06);background:rgba(250,247,240,.35)}
.pin{width:36cqw;margin:0 auto;transform-origin:50% 92%}
.pin-wrap{position:relative}
.pin-wrap.in .pin{animation:pinDrop 1.3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pinDrop{0%{opacity:0;transform:translateY(-14cqw) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
.ripple{position:absolute;left:50%;bottom:1.2cqw;width:26cqw;height:6cqw;border-radius:50%;border:1px solid rgba(160,150,120,.6);transform:translateX(-50%) scale(.4);opacity:0}
.pin-wrap.in .ripple{animation:ripple 3.2s ease-out 1s infinite}
.pin-wrap.in .ripple.r2{animation-delay:2.6s}
@keyframes ripple{0%{opacity:.8;transform:translateX(-50%) scale(.4)}100%{opacity:0;transform:translateX(-50%) scale(1.5)}}
.venue{font-family:var(--lat),var(--ar);font-size:7.4cqw;font-weight:600;color:#26332a;margin-top:4cqw;line-height:1.15}
.city{font-family:var(--lat),var(--ar);font-size:5cqw;color:#3b3f37;letter-spacing:.05em;font-weight:500}
.bye{font-size:4.8cqw;color:#34392f}

/* 5) الألوان */
.s-dress{padding-top:34cqw;padding-bottom:8cqw}
.dress-en{font-family:var(--lat);font-size:5.4cqw;font-weight:500;color:#2d342c;margin-top:-1cqw}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:4cqw 4.4cqw;margin:6cqw auto 2cqw;width:84cqw}

  transform:scale(.4);opacity:0;transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .6s}
.sw .swc img{width:100%;height:100%;object-fit:cover;transition:transform 3s ease}

.sw.in .swc{transform:none;opacity:1}
.sw.in .swc:nth-child(2){transition-delay:.12s}.sw.in .swc:nth-child(3){transition-delay:.24s}.sw.in .swc:nth-child(4){transition-delay:.36s}.sw.in .swc:nth-child(5){transition-delay:.48s}

/* 6) ملاحظات */
.s-notes{padding-top:26cqw;padding-bottom:6cqw}

/* 7) تأكيد الحضور */
.s-rsvp{padding-top:22cqw;padding-bottom:52cqw}
.form{margin:6cqw auto 0;text-align:start;width:76cqw}
.form label.lb{display:block;font-size:4.4cqw;color:#3b3e36;margin:0 0 1.6cqw}
[dir=ltr] .form label.lb{font-family:var(--lat);font-size:4.4cqw;font-weight:600}
.field{position:relative;display:block;width:100%;border:1px solid #b9b5a2;border-radius:2.6cqw;background:rgba(251,248,241,.75);
  font:inherit;font-size:16px;color:#2f3a2f;padding:2.8cqw 10cqw 2.8cqw 3cqw;outline:none;transition:border-color .2s,box-shadow .2s}
[dir=ltr] .field{padding:2.8cqw 3cqw 2.8cqw 10cqw;font-family:var(--lat);font-size:17px}
.field:focus{border-color:var(--sage);box-shadow:0 0 0 .8cqw rgba(125,146,122,.18)}
.fwrap{position:relative;margin-bottom:4.4cqw}
.fwrap svg{position:absolute;top:3.2cqw;right:3cqw;width:4.6cqw;height:4.6cqw;color:#8b8a7c;pointer-events:none}
[dir=ltr] .fwrap svg{right:auto;left:3cqw}
textarea.field{min-height:22cqw;resize:vertical}
.radio{display:flex;align-items:center;gap:3cqw;font-size:4.8cqw;margin:0 0 3cqw;cursor:pointer;color:#2f3a2f}
[dir=ltr] .radio{font-family:var(--lat);font-size:4.8cqw;font-weight:500}
.radio input{appearance:none;-webkit-appearance:none;width:5.2cqw;height:5.2cqw;border-radius:50%;border:1px solid #8f8c7c;background:#fbf8f1;display:grid;place-items:center;margin:0}
.radio input::after{content:"";width:2.8cqw;height:2.8cqw;border-radius:50%;background:var(--sage-d);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.radio input:checked::after{transform:scale(1)}
.radios{margin:1cqw 0 5cqw}
.send{width:100%;margin-top:4cqw;height:13cqw;font-size:4.6cqw}
.sent{display:none;padding:6cqw 4cqw;border-radius:4cqw;background:rgba(251,248,241,.7);border:1px solid #cfc7b3;margin-top:6cqw}
.sent.show{display:block;animation:fadeUp .8s ease both}
.sent b{display:block;font-size:5cqw;color:var(--green);margin-bottom:1cqw}
@keyframes fadeUp{from{opacity:0;transform:translateY(4cqw)}to{opacity:1;transform:none}}
.err{color:#9b4b3c;font-size:3.6cqw;min-height:5cqw;margin-top:2cqw}

/* الورد الصغير اللي بينزل */
#petals{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pt{position:absolute;top:-6vh;left:0;will-change:transform;animation:fall var(--d,6s) linear var(--dl,0s) forwards}
.pt>i{display:block;width:var(--s,12px);height:var(--s,12px);animation:spin var(--sd,3s) ease-in-out infinite alternate}
.pt svg{width:100%;height:100%;display:block}
@keyframes fall{
  0%{transform:translate3d(var(--x),0,0);opacity:0}
  6%{opacity:var(--op,1)}
  25%{transform:translate3d(calc(var(--x) + var(--dx)),27vh,0)}
  50%{transform:translate3d(calc(var(--x) - var(--dx)*.6),55vh,0)}
  75%{transform:translate3d(calc(var(--x) + var(--dx)*.8),82vh,0);opacity:var(--op,1)}
  100%{transform:translate3d(calc(var(--x) - var(--dx)*.3),112vh,0);opacity:0}
}
@keyframes spin{from{transform:rotate(var(--r0,0deg)) rotateY(0)}to{transform:rotate(var(--r1,200deg)) rotateY(55deg)}}

/* زرار الأغنية — بيظهر بعد فتح الظرف */
#music{position:fixed;z-index:40;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));width:46px;height:46px;border-radius:50%;
  display:none;align-items:center;justify-content:center;background:rgba(251,248,241,.92);border:1px solid #c9c1ad;color:#4f6a4c;
  box-shadow:0 6px 18px rgba(70,60,40,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s}
#music.show{display:flex;animation:fadeUp .6s ease both}
#music:active{transform:scale(.92)}
#music svg{width:20px;height:20px}
#music .bars{display:flex;gap:2px;align-items:flex-end;height:16px}
#music .bars i{width:3px;background:currentColor;border-radius:2px;height:5px;animation:bar 1s ease-in-out infinite alternate}
#music .bars i:nth-child(2){animation-delay:.25s}#music .bars i:nth-child(3){animation-delay:.5s}#music .bars i:nth-child(4){animation-delay:.15s}
@keyframes bar{from{height:4px}to{height:16px}}
#music .off{display:none}
#music.paused .bars{display:none}#music.paused .off{display:block}
@media (prefers-reduced-motion:reduce){

}

      if (stack !== was) { el.classList.toggle('wv-stack', stack); el.style.removeProperty('--fit'); cur = 1; ws = widths(); one = ws.reduce(function (a, b) { return a + b; }, 0); }
      natural = stack ? Math.max.apply(null, ws) : one;
    }
    var want = avail > 0 && natural > avail + 1 ? Math.max(0.45, (avail / natural) * 0.97) : 1;
    if (Math.abs(want - cur) < 0.01) return;
    if (want === 1) el.style.removeProperty('--fit'); else el.style.setProperty('--fit', want.toFixed(3));
  }
  function fitAll() {
    hideEmpty();
    // حروف الختم من الأسامي اللي ظاهرة (لو صاحب الدعوة غيّرها) — إلا لو هو كاتب الحروف بنفسه
    var mono = byId('pp61');
    if (mono && mono.textContent === mono.dataset.auto) {
      var t = sealText();
      if (t !== mono.textContent) { mono.textContent = t; mono.dataset.auto = t; }
    }
    $$('.fit').forEach(fitOne);
  }
  var fitT = 0;
  var fitSoon = function () { clearTimeout(fitT); fitT = setTimeout(fitAll, 60); };
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  /* saved words (tap-to-edit) are put in after this script, so fit again once they are in (Wedvo) */
  window.addEventListener('load', fitAll); setTimeout(fitAll, 500); setTimeout(fitAll, 1500);
  addEventListener('resize', fitSoon);
  var lastTexts = '';
  var watched = $$('.fit, [data-elem-id="pp8"], [data-elem-id="pp38"]');
  var onText = function () {
    var now = watched.map(function (el) { return el.textContent; }).join('|');
    if (now !== lastTexts) { lastTexts = now; fitSoon(); }
  };
  watched.forEach(function (el) { new MutationObserver(onText).observe(el, { subtree: true, characterData: true, childList: true }); });

  /* ---------- الظهور مع النزول ---------- */
  var revealSel = '.r,[data-fl],[data-tl],[data-pin],[data-sw],.ti';
  function observe() {
    if (STATIC || !('IntersectionObserver' in window)) { $$(revealSel).forEach(function (el) { el.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
    $$(revealSel).forEach(function (el) { io.observe(el); });
  }
  // بارالاكس خفيف للورد
  var fls = $$('[data-fl]'), ticking = false;
  function para() {
    ticking = false;
    var vh = innerHeight;
    fls.forEach(function (f) {
      var r = f.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) return;
      f.style.transform = 'translate3d(0,' + ((((r.top + r.height / 2) - vh / 2) / vh) * -18).toFixed(1) + 'px,0)';
    });
  }
  if (!STATIC && !REDUCE) addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(para); } }, { passive: true });

  /* ---------- الورد الصغير اللي بينزل من فوق ---------- */
  var FLORET = [
    '<svg viewBox="0 0 20 20"><g fill="#fffdf8" stroke="#e4dccb" stroke-width=".5"><circle cx="10" cy="4.6" r="3.6"/><circle cx="15.2" cy="8.4" r="3.6"/><circle cx="13.2" cy="14.6" r="3.6"/><circle cx="6.8" cy="14.6" r="3.6"/><circle cx="4.8" cy="8.4" r="3.6"/></g><circle cx="10" cy="10" r="2.6" fill="#e8dfae"/><circle cx="10" cy="10" r="1.2" fill="#c9b878"/></svg>',
    '<svg viewBox="0 0 20 20"><g fill="#fff" stroke="#e6ddcc" stroke-width=".5"><ellipse cx="10" cy="5" rx="3" ry="4"/><ellipse cx="15" cy="10" rx="4" ry="3"/><ellipse cx="10" cy="15" rx="3" ry="4"/><ellipse cx="5" cy="10" rx="4" ry="3"/></g><circle cx="10" cy="10" r="2.2" fill="#eadfb4"/></svg>',
    '<svg viewBox="0 0 24 24"><defs><radialGradient id="pk" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff6f3"/><stop offset=".6" stop-color="#f6d9d2"/><stop offset="1" stop-color="#e8b9ae"/></radialGradient></defs><path d="M12 2C6 6 4.5 13 7.5 19c1.5 3 7.5 3 9 0C19.5 13 18 6 12 2Z" fill="url(#pk)" stroke="#e5c3b9" stroke-width=".4"/><path d="M12 4c-1 5-1 10 0 16" stroke="#efcdc4" stroke-width=".5" fill="none"/></svg>',
    '<svg viewBox="0 0 24 24"><defs><radialGradient id="wp" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#f7f1e6"/><stop offset="1" stop-color="#e7dccb"/></radialGradient></defs><path d="M12 3C7 6 5 12 8 18c1.6 3 6.4 3 8 0 3-6 1-12-4-15Z" fill="url(#wp)" stroke="#e2d8c6" stroke-width=".4"/></svg>'
  ];
  var petals = $('#petals');
  function dropOne(burst) {
    var vw = innerWidth;
    var kind = Math.random() < 0.7 ? (Math.random() < 0.6 ? 0 : 1) : (Math.random() < 0.55 ? 2 : 3);
    var s = kind < 2 ? 7 + Math.random() * 9 : 11 + Math.random() * 10;
    var el = document.createElement('div'); el.className = 'pt';
    var d = (burst ? 4.2 : 7) + Math.random() * (burst ? 3 : 4);
    el.style.cssText = '--x:' + Math.round(Math.random() * vw) + 'px;--dx:' + Math.round(20 + Math.random() * 50) + 'px;--d:' + d.toFixed(2) + 's;--dl:' + (burst ? Math.random() * 1.6 : 0).toFixed(2) + 's;--s:' + s.toFixed(1) + 'px;--op:' + (0.75 + Math.random() * 0.25).toFixed(2);
    var i = document.createElement('i');
    i.style.cssText = '--sd:' + (2 + Math.random() * 2.5).toFixed(2) + 's;--r0:' + Math.round(Math.random() * 360) + 'deg;--r1:' + Math.round(180 + Math.random() * 360) + 'deg';
    i.innerHTML = FLORET[kind];
    el.appendChild(i); petals.appendChild(el);
    setTimeout(function () { el.remove(); }, (d + 2) * 1000);
  }
  function shower() {
    if (REDUCE) return;
    for (var k = 0, n = Math.min(70, Math.round(innerWidth / 6)); k < n; k++) dropOne(true);
    var left = 40;
    var amb = setInterval(function () { if (document.hidden) return; dropOne(false); if (--left <= 0) clearInterval(amb); }, 1400);
  }

  /* ---------- الموسيقى: بتبدأ مع ضغطة فتح الظرف ---------- */
  var song = $('#invitation-audio'); if (C.song) song.setAttribute('src', C.song); var musicBtn = $('#music'), wantMusic = true, opened = false;
  function startSong() {
    if (!song.getAttribute('src')) return;
    try { song.volume = 0; } catch (e) {}
    var p = song.play();
    if (p && p.catch) p.catch(function () { musicBtn.classList.add('paused'); });
    var v = 0, fade = setInterval(function () { v = Math.min(1, v + 0.05); try { song.volume = v; } catch (e) {} if (v >= 1) clearInterval(fade); }, 120);
    setTimeout(function () { musicBtn.classList.add('show'); }, 1200);
  }
  musicBtn.addEventListener('click', function () {
    if (song.paused) { wantMusic = true; song.play(); } else { wantMusic = false; song.pause(); }
  });
  song.addEventListener('play', function () { musicBtn.classList.remove('paused'); });
  song.addEventListener('pause', function () { musicBtn.classList.add('paused'); });
  document.addEventListener('visibilitychange', function () {
    if (!opened || !song.getAttribute('src')) return;
    if (document.hidden) song.pause(); else if (wantMusic) song.play().catch(function () {});
  });

  /* ---------- فتح الظرف: الختم يلمع ← الظرف ينزل لتحت ← الدعوة تظهر ---------- */
  function openInvite() {
    if (opened) return;
    opened = true;
    cover.classList.remove('cv-pulse');
    cover.classList.add('opening');
    startSong();
    setTimeout(function () { document.body.classList.remove('locked'); scrollTo(0, 0); observe(); fitAll(); }, 650);
    setTimeout(shower, 700);
    setTimeout(function () { cover.classList.add('gone'); }, 1900);
  }
  if (STATIC) {
    // المحرر: الظرف بيفضل موجود (زرار "الغلاف" في المحرر بيظهره عشان كلامه يتعدّل) — المعاينة الثابتة من غيره
    if (EDIT) cover.classList.add('pp-cover-edit'); else cover.remove();
    document.body.classList.remove('locked');
    observe();
  } else {
    cover.addEventListener('click', openInvite);
    cover.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); } });
  }

  /* ---------- تأكيد الحضور ---------- */
  (function () {
    var page = $('#wv-rsvp'), form = $('#rsvpForm'), err = $('#err'), btn = $('#rSend');
    var sid = window.__WV_RSVP || '';
    var SENT_KEY = 'wv_rsvp_' + location.pathname;
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };
    function done(name) {
      form.style.display = 'none';
      $('#sent').classList.add('show');
      if (name) store.set('wv_guest_name', name);
      if (!STATIC) for (var k = 0; k < 24; k++) dropOne(true);
    }
    // ضيف ردّ قبل كده من نفس الجهاز — بنوريله إن ردّه وصل
    if (!STATIC && sid && store.get(SENT_KEY)) done();
    var busy = false;
    function submit() {
      if (EDIT || busy) return;
      var name = form.name.value.trim(), att = (form.querySelector('input[name=att]:checked') || {}).value;
      if (!name) { err.textContent = L('من فضلك اكتب اسمك', 'Please write your name'); return; }
      if (!att) { err.textContent = L('من فضلك اختار هتحضر ولا لأ', 'Please choose whether you will attend'); return; }
      err.textContent = '';
      if (!sid) { done(name); return; }
      busy = true; btn.style.opacity = '.6';
      fetch(sid, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ guestName: name, attending: att, note: ($('#noteField').classList.contains('off') ? '' : form.message.value.trim()) })
      }).then(function (r) {
        if (r.ok) { store.set(SENT_KEY, '1'); return done(name); }
        return r.json().catch(function () { return {}; }).then(function (j) { throw new Error((AR && j.error) || L('الرد ماوصلش، جرّب تاني بعد لحظة', 'Your reply could not be sent, please try again')); });
      }).catch(function (x) { err.textContent = x.message; }).then(function () { busy = false; btn.style.opacity = ''; });
    }
    btn.addEventListener('click', submit);
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); submit(); } });
    form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    page.addEventListener('input', function () { err.textContent = ''; });
  })();
})();
</script>

<style>
  /* شكل نظيف زي الموبايل الحقيقي — بنخفي شريط التمرير (الصفحة بتفضل بتتمرّر
     عادي باللمس أو العجلة، بس من غير الشريط اللي كان بيبان على الجنب وشكله وحش،
     خصوصًا جوه فريم المعاينة في المحرر). */
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; display: none; }
</style>
<script>
(function () {
  // أي عنصر نصه بيبدأ بوقت (5:00 ...) هو خانة وقت في جدول البرنامج
  var TIME_RE = /^\s*\d{1,2}:\d{2}\b/;

  function fixTimes() {
    var atoms = document.querySelectorAll('.tn-atom');
    for (var i = 0; i < atoms.length; i++) {
      var el = atoms[i];
      if (el.getAttribute('data-wda-time-fixed')) continue;
      var text = (el.textContent || '').trim();
      if (!TIME_RE.test(text)) continue;
      el.setAttribute('data-wda-time-fixed', '1');
      el.style.whiteSpace = 'nowrap';
      el.style.overflow = 'visible';
    }
  }

  // ===== الخريطة اللي بتتدفن تحت الرسمة =====
  // في قسم المكان، كل عناصر Tilda متظبط ليها z-index رقم (3 مثلاً) ما
  // عدا العنصر اللي بنحقن فيه الخريطة — طالع من التصدير بـ z-index:auto.
  // وكلهم position:absolute فوق بعض، فأي عنصر برقم بيتغطّى فوق الخريطة:
  // في قالب Viktor & Paula رسمة المبنى كانت مغطّية الخريطة بالكامل ومش
  // باين منها غير ركن صغير.
  // الحل: نرفع عنصر الخريطة فوق أعلى أخ ليه في نفس القسم.
  function fixMapLayer() {
    var maps = document.querySelectorAll('iframe[src*="google.com/maps"], iframe[src*="maps.google"]');
    for (var i = 0; i < maps.length; i++) {
      var host = maps[i].closest('[data-elem-id]');
      if (!host || host.getAttribute('data-wda-map-fixed')) continue;
      // الخريطة اللي اتنقلت تحت الصورة خلاص (Viktor & Paula) مبقاش لها
      // دعوة برفع الـ z-index — هي في مسارها الطبيعي مش فوق حاجة
      if (host.getAttribute('data-wda-map-relocated')) continue;
      var rec = host.closest('.t-rec');
      if (!rec) continue;

      var top = 0;
      var siblings = rec.querySelectorAll('[data-elem-id]');
      for (var j = 0; j < siblings.length; j++) {
        var z = parseInt(getComputedStyle(siblings[j]).zIndex, 10);
        if (!isNaN(z) && z > top) top = z;
      }

      host.setAttribute('data-wda-map-fixed', '1');
      host.style.setProperty('z-index', String(top + 1), 'important');
      // ولو موقعه static لأي سبب، الـ z-index مش هيشتغل أصلاً
      if (getComputedStyle(host).position === 'static') {
        host.style.setProperty('position', 'relative', 'important');
      }
    }
  }

  // ===== خريطة Viktor & Paula كانت طايحة فوق صورة اللوكشن =====
  // في قسم "Location" التصميم حاطط الخريطة (iframe) والصورة فوق بعض في
  // نفس المكان بالظبط داخل لوحة Tilda المطلقة (t396)، فالخريطة كانت
  // مدفونة تحت الصورة ومش باينة. رفع الـ z-index بيخليها فوق الصورة —
  // بس ساعتها بتغطّيها. اللي العميل عايزه: الخريطة **تحت** الصورة في
  // مساحة مرتّبة لوحدها.
  //
  // الحل: بنطلّع عنصر الخريطة برّه اللوحة المطلقة ونحطه في شريط عادي
  // (flow) وسط الصفحة تحت اللوحة مباشرة، ونكبّر الـ iframe شوية. كده
  // الصورة بتبان كاملة والخريطة تحتها منسّقة. بيتنادى في المحرر والدعوة
  // المنشورة الاتنين، فالشكل واحد.
  function fixViktorMap() {
    var host = document.querySelector('[data-elem-id="1772899000001"]');
    if (!host || host.getAttribute('data-wda-map-relocated')) return;
    var t396 = host.closest('.t396');
    if (!t396 || !t396.parentNode) return;

    host.setAttribute('data-wda-map-relocated', '1');

    // بنشيل التموضع المطلق بتاع Tilda عن عنصر الخريطة عشان يمشي عادي
    host.style.setProperty('position', 'static', 'important');
    host.style.setProperty('top', 'auto', 'important');
    host.style.setProperty('left', 'auto', 'important');
    host.style.setProperty('right', 'auto', 'important');
    host.style.setProperty('bottom', 'auto', 'important');
    host.style.setProperty('width', '100%', 'important');
    host.style.setProperty('max-width', '480px', 'important');
    host.style.setProperty('height', 'auto', 'important');
    host.style.setProperty('margin', '0', 'important');
    host.style.setProperty('transform', 'none', 'important');

    // شريط عادي وسط الصفحة تحت لوحة القسم مباشرة
    var strip = document.createElement('div');
    strip.className = 'wda-map-strip';
    strip.style.cssText = 'width:100%; box-sizing:border-box; display:flex;'
      + ' justify-content:center; padding:10px 16px 40px;';
    strip.appendChild(host);
    t396.parentNode.insertBefore(strip, t396.nextSibling);

    // نكبّر الـ iframe شوية ونظبّط شكله
    var frame = host.querySelector('iframe');
    if (frame) {
      frame.setAttribute('width', '100%');
      frame.setAttribute('height', '320');
      frame.style.width = '100%';
      frame.style.maxWidth = '480px';
      frame.style.height = '320px';
      frame.style.border = '0';
      frame.style.borderRadius = '14px';
      frame.style.boxShadow = '0 10px 30px -12px rgba(0,0,0,.35)';
    }
    // العمود اللي جوّه (الخريطة + رابط "Open in Google Maps") يتمدد
    // على عرض الشريط عشان يفضل متوسّط
    var col = host.querySelector('.tn-atom__html > div, .tn-atom > div');
    if (col) { col.style.width = '100%'; col.style.maxWidth = '480px'; }
  }

  // ===== قالب فيه زرار موسيقى شكلي من غير صوت =====
  // Royal Maroon اتعمل بزرار موسيقى "ديكوري" — مفيش عنصر <audio> ولا
  // تشغيل فعلي، فالأغنية اللي العميل بيختارها عمرها ما بتشتغل. بنحقن
  // عنصر صوت بمعرّف invitation-audio (اللي طبقة التخصيص بتحط فيه رابط
  // الأغنية) ونوصّل الزرار بيه — من غير ما نلمس ملف التصميم.
  function fixMissingAudio() {
    var btn = document.getElementById('musicBtn');
    if (!btn || btn.getAttribute('data-wda-audio-wired')) return;
    if (document.getElementById('invitation-audio')) return;   // فيه صوت خلاص
    btn.setAttribute('data-wda-audio-wired', '1');

    var audio = document.createElement('audio');
    audio.id = 'invitation-audio';
    audio.loop = true;
    audio.preload = 'auto';
    audio.setAttribute('playsinline', '');
    audio.style.display = 'none';
    audio.appendChild(document.createElement('source'));
    document.body.appendChild(audio);

    function hasSrc() {
      return audio.currentSrc || audio.src
        || (audio.querySelector('source') && audio.querySelector('source').src);
    }
    function markBtn(on) {
      btn.classList.toggle('playing', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    function startMusic() {
      if (!hasSrc() || !audio.paused) return;
      var p = audio.play();
      if (p && p.catch) p.catch(function () { /* المتصفح رفض التشغيل */ });
      markBtn(true);
    }

    // بنمسك ضغطة الزرار في مرحلة الالتقاط ونوقف انتشارها عشان زرار
    // التصميم الشكلي (اللي بيقلب كلاس بس) ما يتعارضش مع التشغيل الفعلي.
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (!hasSrc()) return;   // العميل لسه ماختارش أغنية
      if (audio.paused) {
        startMusic();
      } else {
        audio.pause();
        markBtn(false);
      }
    }, true);

    // ===== الموسيقى تشتغل أول ما الضيف يفتح الدعوة =====
    // قوالب Tilda بتربط الأغنية بزرار الفتح (.popup-enter) فبتشتغل مع
    // الفتح على طول. Royal Maroon زرار فتحه منفصل (#openBtn) وكان مربوط
    // بزرار الموسيقى لوحده بس — فالضيف كان لازم يدوس زرار تاني عشان
    // يسمع، والعميل عايزها تشتغل أول ما يفتح زي باقي القوالب. ض��طة الفتح
    // نفسها تفاعُل مستخدم، فالمتصفح بيسمح بالتشغيل جواها. لو الضيف قفل
    // الموسيقى بعد كده بزرار الموسيقى، اختياره بيفضل (مش بنعيد تشغيلها).
    var openBtn = document.getElementById('openBtn');
    if (openBtn && !openBtn.getAttribute('data-wda-audio-open')) {
      openBtn.setAttribute('data-wda-audio-open', '1');
      openBtn.addEventListener('click', function () {
        // شوية تأخير عشان نضمن إن طبقة التخصيص خلّصت تحطّ رابط الأغنية
        setTimeout(startMusic, 0);
      });
    }
  }

  // ===== حركة الظهور اللي كانت واقفة في نصها =====
  // محرك الحركة بتاع Tilda بيشتغل على خطوتين: أول ما الصفحة تحمّل بيحط
  // كل عنصر في "حالة البداية" (النص نازل 30 بكسل تحت مكانه، والزخارف
  // بحجم 30% من حجمها)، وبعدين بيستنى حدث تمرير (scroll) عشان يكشف
  // اللي ظاهر في الشاشة ويشغّل حركته.
  //
  // المشكلة: الدعوة بتفتح على شاشة "اضغط للفتح"، والشاشة الأولى ورا
  // الغلاف — يعني محدش بيعمل scroll عليها أبدًا. فالمحرك بيفضل مستني
  // حدث عمره ما هييجي، وأول شاشة في الدعوة بتفضل متجمّدة في حالة
  // البداية: الكلام واقف 30 بكسل تحت مكانه الصح ومش بيتحرك، والورود
  // والزخارف بتبان صغيرة (30%) من غير ما تكبر.
  //
  // ده اللي كان العميل شايفه ومستغرب ليه الكلام "مش بيتحرك" في الوش.
  // الحل: نبعت للمحرك حدث التمرير اللي مستنيه بنفسنا. حدث تمرير مالوش
  // أي أثر جانبي على الصفحة: هي مش بتتحرك من مكانها، إحنا بس بنصحّي
  // المحرك.
  //
  // بس بشرطين مهمين:
  //
  // (١) مانبعتش الحدث إلا لما يكون فيه فعلاً عنصر متجمّد وظاهر. حالة
  //     البداية ليها شكل معروف: translate3d(0px, Npx, 0px) للنصوص،
  //     و scale(0.N) للزخارف. لو مفيش ولا عنصر كده، يبقى المحرك خلّص
  //     شغله ومفيش داعي نبعتله حاجة تاني.
  //
  // (٢) مانبعتوش أبدًا والعميل ماسك عنصر بيسحبه. مكتبة السحب بتسمع
  //     لأحداث التمرير، وأي حدث في نص السحبة بيلغيها — فالعميل يمسك
  //     الكلام ويسحبه وميحصلش حاجة. ده كان هيحوّل مشكلة لمشكلة تانية.
  var START_TRANSFORM = /translate3d(0px,s*[1-9][0-9]*(.[0-9]+)?px,s*0px)|scale(0?.[0-9]+)/;

  /**
   * فيه عنصر لسه واقف في حالة بداية الحركة؟
   *
   * ملحوظة مهمة: مبنسألش "وظاهر في الشاشة" بالقصد. وإحنا على شاشة
   * "اضغط للفتح"، الشاشة الأولى بتكون تحت الغلاف — يعني تحت حدود
   * الشاشة فنيًا. فلو اشترطنا إنها تكون ظاهرة، مكناش هننبّه المحرك
   * أبدًا في الوقت اللي هو محتاج التنبيه فيه بالظبط.
   */
  function hasFrozenElement() {
    var nodes = document.querySelectorAll('[data-elem-id]');
    for (var i = 0; i < nodes.length; i++) {
      if (START_TRANSFORM.test(nodes[i].style.transform || '')) return true;
    }
    return false;
  }

  function nudgeAnimations() {
    // العميل ماسك عنصر بيحرّكه — أي حدث تمرير دلوقتي هيلغي السحبة
    if (document.querySelector('.wda-dragging')) return;
    if (!hasFrozenElement()) return;
    // الاتنين مع بعض بالقصد: محرك Tilda بيراجع اللي ظاهر في الشاشة على
    // resize، والتمرير لوحده مش كفاية يصحّيه.
    try {
      window.dispatchEvent(new Event('scroll'));
      window.dispatchEvent(new Event('resize'));
    } catch (e) {
      // متصفحات قديمة مش بتعرف constructor بتاع Event
      ['scroll', 'resize'].forEach(function (name) {
        var ev = document.createEvent('Event');
        ev.initEvent(name, true, true);
        window.dispatchEvent(ev);
      });
    }
  }

  // بنصحّي المحرك على مراحل: الحركة بتتسجّل بعد ما سكريبتات Tilda
  // تحمّل من الشبكة، فنبضة واحدة بدري ممكن تيجي قبلها.
  function nudgeSoon() {
    nudgeAnimations();
    setTimeout(nudgeAnimations, 120);
    setTimeout(nudgeAnimations, 600);
    setTimeout(nudgeAnimations, 1500);
  }

  // ضغطة فتح الغلاف بالتحديد — الشاشة اللي ورا الغلاف هي بالظبط اللي
  // كانت متجمّدة. بنسمع للضغطة على زرار الفتح نفسه، مش على أي ضغطة في
  // الصفحة، عشان مانتدخلش في تعامل العميل مع الدعوة بعد كده.
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('.popup-enter, #openBtn, #coverScreen, #coverCard')) nudgeSoon();
  }, true);

  // ===== Royal Maroon: مسافة بين الكروت الماروني المتلاصقة =====
  // كروت Royal (.dark-card) بتركب فوق بعض من غير فاصل رأسي؛ ولما العميل
  // يخفي قسم الألبوم اللي بين كارت الأسماء/التاريخ (#weddingInfoCard)
  // وكارت العدّ التنازلي (#receptionCard) الكارتين بيلزقوا في بعض. بنحط
  // مسافة فوق كارت الاستقبال. #receptionCard موجود في Royal Maroon بس،
  // فالقاعدة آمنة ومخصوصة له من غير ما نلمس ملف التصميم.
  function fixRoyalCardGap() {
    if (document.getElementById('wda-royal-gap')) return;
    if (!document.getElementById('receptionCard')) return;
    var st = document.createElement('style');
    st.id = 'wda-royal-gap';
    st.textContent = '#receptionCard{margin-top:28px;}';
    (document.head || document.documentElement).appendChild(st);
  }

  // ===== غلاف المظروف بالفيديو (Royal Maroon — الدعوات الجديدة بس) =====
  // الضيف بيشوف صورة مظروف مقفول، يدوس عليها فالفيديو يفتح المظروف،
  // وأول ما يخلص الدعوة تفتح عادي. كله بالحقن من غير لمس ملف التصميم.
  //
  // متحكم فيه بعلمين عشان **ما نعككش** الدعوات القديمة:
  //   (١) coverStyle === 'envelope' — بيتحط للدعوات الجديدة من Royal بس؛
  //       الدعوات القديمة المشاركة مالهاش القيمة دي فبتفضل بغلافها الأصلي.
  //   (٢) مش autoOpen — يعني بنتخطاه في المحرر (صاحب الدعوة بيعدّل المحتوى)؛
  //       بيبان في المعاينة/عند الضيف بس.
  function initEnvelopeCover() {
    var cfg = window.__INVITATION_CONFIG__ || {};
    if (cfg.coverStyle !== 'envelope') return;
    if (cfg.autoOpen) return;
    if (document.getElementById('wda-envelope')) return;
    var coverScreen = document.getElementById('coverScreen');
    var openBtn = document.getElementById('openBtn');
    if (!coverScreen || !openBtn) return;   // Royal Maroon بس

    var st = document.createElement('style');
    st.textContent =
      '#wda-envelope{position:fixed;inset:0;z-index:2000000;background:#3a0011;overflow:hidden;cursor:pointer;}'
      + '#wda-envelope .wda-env-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;}'
      + '#wda-envelope .wda-env-video{display:none;background:#3a0011;}'
      + '#wda-envelope .wda-env-hint{position:absolute;left:0;right:0;bottom:40px;text-align:center;'
      + 'color:rgba(255,238,222,.92);font-size:14px;letter-spacing:.5px;z-index:2;pointer-events:none;'
      + 'text-shadow:0 1px 8px rgba(0,0,0,.5);animation:wda-env-pulse 1.9s ease-in-out infinite;}'
      + '@keyframes wda-env-pulse{0%,100%{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}'
      + '#wda-envelope.wda-env-fade{opacity:0;transition:opacity .6s ease;}';
    (document.head || document.documentElement).appendChild(st);

    var ov = document.createElement('div');
    ov.id = 'wda-envelope';

    var img = document.createElement('img');
    img.className = 'wda-env-media wda-env-img';
    img.alt = '';
    // WebP أخف بـ 60% من الـ JPG (144KB بدل 358KB) — وده أول حاجة الضيف
    // بيشوفها. المتصفحات القديمة جدًا اللي مبتعرفش WebP بترجع للـ JPG.
    img.onerror = function () { img.onerror = null; img.src = 'assets/royal-envelope-cover.jpg'; };
    img.src = 'assets/royal-envelope-cover.webp';
    img.setAttribute('fetchpriority', 'high');

    var video = document.createElement('video');
    video.className = 'wda-env-media wda-env-video';
    video.src = 'assets/royal-envelope-open.mp4';
    video.preload = 'auto';
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    // صوت الفيديو مكتوم — الصوت بييجي من ملف الموسيقى تحت بدله
    video.muted = true;
    video.setAttribute('muted', '');

    // صوت الغلاف الافتراضي — بيشتغل بس لو العميل ماختارش أغنية خاصة لدعوته.
    // لو اختار أغنية، بنشغّل **أغنيته هو** (عشان تغيير الأغنية يشتغل فعلًا،
    // مش صوت ثابت بيتجاهل اختياره).
    var DEFAULT_ENV_SOUND = 'assets/cloud-song.mp3';

    var hint = document.createElement('div');
    hint.className = 'wda-env-hint';
    hint.textContent = (cfg.language === 'en') ? 'Tap to open the invitation' : 'اضغط لفتح الدعوة';

    ov.appendChild(img);
    ov.appendChild(video);
    ov.appendChild(hint);
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';

    var started = false, finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      // نشيل خلفية المظروف اللي في الـ <head> (body::before) عشان محتوى
      // الدعوة يبان بعد الفتح
      document.body.classList.add('wda-env-open');
      ov.classList.add('wda-env-fade');
      setTimeout(function () {
        try { video.pause(); } catch (e) { /* لا شيء */ }
        if (ov.parentNode) ov.parentNode.removeChild(ov);
        // بنشغّل الفتح الأصلي (بيكشف محتوى الدعوة + بيشغّل الموسيقى عبر
        // ربط زرار الفتح في fixMissingAudio)
        openBtn.click();
      }, 600);
    }

    function start() {
      if (started) return;
      started = true;
      hint.style.display = 'none';
      video.style.display = 'block';
      // بنشغّل موسيقى الدعوة مع فتح المظروف (أول ضغطة = تفاعل مستخدم فالمتصفح
      // بيسمح بالتشغيل): أغنية العميل لو اختارها، وإلا الصوت الافتراضي. بنستخدم
      // نفس عنصر #invitation-audio بتاع الدعوة — فأغنية العميل الجديدة بتشتغل
      // ومفيش صوتين، وبتفضل شغّالة جوه الدعوة بعد الفتح.
      try {
        var invAudio = document.getElementById('invitation-audio');
        if (invAudio) {
          var hasSong = invAudio.currentSrc || invAudio.getAttribute('src')
            || (invAudio.querySelector('source') && invAudio.querySelector('source').getAttribute('src'));
          if (!hasSong) { invAudio.src = DEFAULT_ENV_SOUND; invAudio.loop = true; }
          var ap = invAudio.play();
          if (ap && ap.catch) ap.catch(function () { /* المتصفح رفض التشغيل */ });
        }
      } catch (e) { /* لا شيء */ }
      // أمان: لو الفيديو ما رضيش يشتغل أو مفيش مدة، نفتح الدعوة على طول
      var fb = setTimeout(function () { if (!finished && video.paused) finish(); }, 1400);
      video.addEventListener('playing', function () { clearTimeout(fb); }, { once: true });
      var p = video.play();
      if (p && p.catch) p.catch(function () { clearTimeout(fb); finish(); });
    }

    ov.addEventListener('click', function () { if (!started) start(); });
    video.addEventListener('ended', finish);
    // دوسة على الفيديو وهو شغال = تخطي للدعوة على طول
    video.addEventListener('click', function (e) { e.stopPropagation(); if (started) finish(); });
  }

  // ===== قفل التعديل النصي على عناصر ديكورية في Royal Maroon =====
  // نقاط ألوان "قواعد اللباس" وزرار صندوق الهدية مالهمش نص يتكتب. بنعلّم
  // عليهم بـ data-wda-no-text، وسكريبت المحرر بيمنع فتح الكتابة على أي
  // عنصر عليه العلامة دي (في startWriting وفي شريط الأدوات). العلامة
  // بتتحط على العناصر دي بس، فمفيش أي تأثير على باقي القوالب أو العناصر.
  function lockDecorText() {
    var sel = '.dress-dot, .gift-box-btn';
    var nodes = document.querySelectorAll(sel);
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('data-wda-no-text', '1');
    }
  }

  // ===== تأجيل تحميل خريطة جوجل لحد ما الضيف يقرب منها =====
  // إطار الخريطة (iframe) بيجرّ مكتبة جافاسكريبت تقيلة من جوجل (~250KB+)
  // بمجرد ما ياخد src — حتى وهو تحت في الصفحة والضيف لسه بعيد عنه.
  // بنشيل الـ src ونحفظه، ونرجّعه بس لما القسم يقرب من الشاشة
  // (IntersectionObserver مع هامش 500px عشان يبدأ التحميل قبل ما يبان).
  // متصفح قديم من غير IntersectionObserver → بنسيب الخريطة زي ما هي بالظبط
  // (بتحمّل عادي)، فمفيش أي دعوة بتفضل من غير خريطة.
  function deferMaps() {
    if (!('IntersectionObserver' in window)) return;
    var frames = document.querySelectorAll(
      'iframe[src*="google.com/maps"], iframe[src*="maps.google"], iframe[src*="output=embed"]'
    );
    for (var i = 0; i < frames.length; i++) {
      var f = frames[i];
      if (f.getAttribute('data-wda-map-deferred')) continue;
      var src = f.getAttribute('src');
      if (!src) continue;
      f.setAttribute('data-wda-map-deferred', '1');
      f.setAttribute('data-wda-map-src', src);
      f.removeAttribute('src');
      var io = new IntersectionObserver(function (entries, obs) {
        for (var j = 0; j < entries.length; j++) {
          if (!entries[j].isIntersecting) continue;
          var fr = entries[j].target;
          obs.unobserve(fr);
          var s = fr.getAttribute('data-wda-map-src');
          if (s && !fr.getAttribute('src')) fr.setAttribute('src', s);
        }
      }, { rootMargin: '500px' });
      io.observe(f);
    }
  }

  fixTimes();
  fixViktorMap(); fixMissingAudio();
  fixMapLayer(); deferMaps(); fixRoyalCardGap(); initEnvelopeCover(); lockDecorText();
  document.addEventListener('DOMContentLoaded', function () { fixTimes(); fixViktorMap(); fixMissingAudio(); fixMapLayer(); deferMaps(); fixRoyalCardGap(); initEnvelopeCover(); lockDecorText(); nudgeSoon(); });
  window.addEventListener('load', function () { fixTimes(); fixViktorMap(); fixMissingAudio(); fixMapLayer(); deferMaps(); fixRoyalCardGap(); initEnvelopeCover(); lockDecorText(); nudgeSoon(); });

  // الأوقات بتتحق�� من سكريبت التصميم نفسه بعد التحميل، فبنعيد المحاولة
  // شوية ثواني بدل ما نفترض إنها موجودة من أول لحظة.
  var tries = 0;
  var timer = setInterval(function () {
    fixTimes();
    fixViktorMap(); fixMissingAudio();
    fixMapLayer(); deferMaps();
    if (++tries > 20) clearInterval(timer);
  }, 250);

  // عدّاد مستقل لتنبيه محرك الحركة. مستقل عن اللي فوق لأن توقيته مختلف:
  // محرك Tilda بيحمّل من شبكة برّه وبيحط حالة البداية بعد ثانية ونص
  // تقريبًا على نت كويس — وأكتر بكتير على نت بطيء. فبنفضل نحاول لعشر
  // ثواني، وبنقف أول ما مايبقاش فيه عنصر متجمّد (أو نخلص الوقت).
  var animTries = 0;
  var animTimer = setInterval(function () {
    nudgeAnimations();
    // خلصت الحركة؟ مفيش داعي نفضل شغالين
    if (animTries > 6 && !hasFrozenElement()) clearInterval(animTimer);
    if (++animTries > 40) clearInterval(animTimer);
  }, 250);
})();
</script>

<script src="/shared/scroll-hint-v1.js?v=h1122" defer data-gone="#coverScreen" data-color="#5d7057" data-font="'Cormorant Garamond', serif" data-size="11.5" data-weight="600"></script>
