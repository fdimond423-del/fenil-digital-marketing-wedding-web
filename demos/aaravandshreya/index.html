<style>
  :root { --sk-lav: #F2E9F1; --sk-lav2: #E6D5E6; --sk-purple: #C49BBF; --sk-footer: #A290AA; --sk-olive: #515A44; --sk-sage: #7E826B;
    --sk-date: #8B7A93; --sk-dark: #242424; --sk-text: #707070; --sk-heart: #B79CC2; --sk-wood: #A47B57; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; }
  .sk { font-family: 'Mulish', sans-serif; color: var(--sk-text); font-size: 17px; line-height: 1.8; overflow-x: hidden; }
  .sk *, .sk *::before, .sk *::after { box-sizing: border-box; }
  .sk [id] { scroll-margin-top: 90px; }
  .sk img { max-width: 100%; height: auto; display: block; }
  .sk a { color: inherit; text-decoration: none; }
  .sk h1, .sk h2, .sk h3, .sk h4 { font-weight: 400; color: var(--sk-dark); margin: 0; line-height: 1.25; }
  .sk-script { font-family: 'Allura', cursive; }
  .sk-container { max-width: 1320px; margin: 0 auto; padding: 0 20px; position: relative; }
  .sk-pad { padding: 120px 0; }
  .sk-fl { position: absolute; pointer-events: none; z-index: 0; }
  .sk-ph { background: var(--sk-lav); width: 100%; height: 100%; }
  .sk-btn { display: inline-flex; align-items: center; gap: 12px; background: #fff; color: var(--sk-dark) !important; padding: 16px 40px; font: 400 17px/1 'Mulish', sans-serif;
    text-transform: uppercase; border: 0; cursor: pointer; transition: background .2s, color .2s; }
  .sk-btn:hover { background: var(--sk-dark); color: #fff !important; }
  .sk-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  /* Section title */
  .sk-title { text-align: center; margin-bottom: 60px; position: relative; z-index: 1; }
  .sk-title h4 { font-family: 'Allura', cursive; color: var(--sk-sage); font-size: 50px; line-height: 1; }
  .sk-title h2 { font-size: clamp(28px, 4vw, 40px); margin-top: 16px; }
  .sk-rule { width: 490px; max-width: 80%; margin: 22px auto 0; }
  .sk-rule i { display: block; height: 1px; background: #e8e8e8; }
  .sk-rule i + i { width: 58%; margin: 9px auto 0; }

  /* Header */
  .sk-header { position: sticky; top: 0; z-index: 50; background: #fff; transition: box-shadow .3s; }
  .sk-header.sk-stuck { box-shadow: 0 4px 24px rgba(0,0,0,.06); }
  .sk-header .sk-container { display: flex; align-items: center; justify-content: space-between; height: 100px; max-width: 1440px; }
  .sk-logo { font-family: 'Allura', cursive; font-size: 52px; color: var(--sk-olive); line-height: 1; white-space: nowrap; }
  .sk-logo span { color: var(--sk-purple); }
  .sk-nav { display: flex; gap: 34px; }
  .sk-nav a { font-size: 15px; text-transform: uppercase; color: var(--sk-dark); letter-spacing: .02em; transition: color .2s; }
  .sk-nav a:hover { color: var(--sk-purple); }
  .sk-head-rsvp { font-size: 15px; text-transform: uppercase; color: var(--sk-dark); display: inline-flex; gap: 8px; align-items: center; }
  .sk-head-rsvp svg { width: 20px; height: 20px; color: var(--sk-purple); }
  .sk-menu-toggle, .sk-menu-btn { display: none; }

  /* Hero */
  .sk-hero { padding: 0 0 140px; position: relative; }
  .sk-hero-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 900px; position: relative; }
  .sk-hero-art { position: relative; }
  .sk-stripes { position: absolute; right: 0; bottom: 0; width: 88%; height: 86%; border: 18px solid var(--sk-wood); border-bottom: 0;
    border-radius: 999px 0 0 0; background: repeating-linear-gradient(90deg, var(--sk-wood) 0 16px, transparent 16px 52px); }
  .sk-hero-photo { position: absolute; right: 40px; bottom: 0; width: 70%; height: 92%; border-radius: 999px 999px 0 0; overflow: hidden; border: 12px solid #fff; border-bottom: 0;
    box-shadow: 0 10px 40px rgba(80,50,90,.15); z-index: 1; }
  .sk-hero-photo img { width: 100%; height: 100%; object-fit: cover; }
  .sk-hero-panel { background: var(--sk-lav); border-top-right-radius: 100% 90%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 80px 60px 160px; }
  .sk-hero-panel h1 { font-family: 'Allura', cursive; color: var(--sk-olive); font-size: clamp(64px, 8vw, 118px); line-height: 1; }
  .sk-hero-panel h1 span { display: block; font-size: .55em; margin: 10px 0; }
  .sk-hero-panel p { font-size: 24px; margin: 50px 0 14px; color: var(--sk-text); }
  .sk-hero-date { font-size: clamp(36px, 4vw, 52px); font-weight: 600; color: var(--sk-date); letter-spacing: .02em; }
  .sk-hero-garland { left: 50%; bottom: 40px; width: min(1000px, 90vw); transform: translateX(-50%); z-index: 2; }
  .sk-hero-spray-l { left: 0; bottom: 90px; width: 220px; transform: rotate(-35deg); z-index: 2; }
  .sk-hero-spray-r { right: 0; bottom: 90px; width: 220px; transform: rotate(35deg) scaleX(-1); z-index: 2; }

  /* Countdown */
  .sk-count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; padding: 20px 0 120px; }
  .sk-circle { position: relative; width: 220px; aspect-ratio: 1; margin: 0 auto; border-radius: 50%; background: var(--sk-lav); display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .sk-circle::after { content: ""; position: absolute; inset: 8px -8px -8px 8px; border-radius: 50%; border: 1px solid #cdb6cf; }
  .sk-circle b { font-family: 'Allura', cursive; font-weight: 400; font-size: 96px; line-height: .9; color: var(--sk-dark); position: relative; z-index: 1; }
  .sk-circle span { font-size: 20px; color: var(--sk-text); position: relative; z-index: 1; }
  .sk-circle .sk-fl { width: 110px; }
  .sk-circle:nth-child(odd) .sk-fl { left: -78px; bottom: -44px; transform: rotate(-140deg); }
  .sk-circle:nth-child(even) .sk-fl { left: -62px; top: -58px; transform: rotate(-42deg); }

  /* Couple */
  .sk-couple { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; max-width: 1060px; margin: 0 auto; position: relative; z-index: 1; }
  .sk-person { background: #fff; box-shadow: 0 8px 40px rgba(80,60,90,.1); position: relative; min-height: 780px; padding: 40px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .sk-person-photo { position: absolute; top: 0; right: 34px; width: 75%; height: 520px; border-radius: 0 0 0 260px; overflow: hidden; border: 12px solid #fff; border-top: 0; }
  .sk-person:nth-child(2) .sk-person-photo { right: auto; left: 34px; border-radius: 0 0 260px 0; }
  .sk-person:nth-child(2) { text-align: right; }
  .sk-person:nth-child(2) .wl-social { justify-content: flex-end; }
  .sk-person:nth-child(2) svg.sk-role { align-self: flex-end; }
  .sk-person-photo img { width: 100%; height: 100%; object-fit: cover; }
  .sk-person svg.sk-role { width: 44px; height: 54px; color: var(--sk-olive); margin-bottom: 18px; }
  .sk-person h3 { font-size: 35px; font-weight: 600; margin-bottom: 14px; }
  .sk-person p { margin: 0 0 20px; }
  .sk-social, .sk .wl-social { list-style: none; margin: 0; padding: 0; display: flex; gap: 18px; }
  .sk-social a, .sk .wl-social a { color: var(--sk-text); display: block; }
  .sk-social a:hover, .sk .wl-social a:hover { color: var(--sk-purple); }
  .sk-couple-wrap { position: relative; }
  .sk-couple-wrap .sk-fl { width: 230px; top: 100px; }
  .sk-couple-wrap .sk-fl-l { left: -40px; }
  .sk-couple-wrap .sk-fl-r { right: -40px; transform: scaleX(-1); }

  /* Story */
  .sk-story { position: relative; }
  .sk-story .sk-fl-l, .sk-story .sk-fl-r { width: 230px; top: 0; }
  .sk-story .sk-fl-l { left: 0; }
  .sk-story .sk-fl-r { right: 0; transform: scaleX(-1); }
  .sk-story-item { position: relative; display: grid; grid-template-columns: 1fr 1fr; max-width: 1100px; margin: 0 auto 90px; align-items: center; }
  .sk-polaroid { background: #fff; padding: 24px; box-shadow: 0 20px 50px rgba(90,70,110,.14); position: relative; z-index: 1; }
  .sk-polaroid img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .sk-story-text { background: #fff; padding: 70px 50px; box-shadow: 0 20px 50px rgba(90,70,110,.12); text-align: center; margin-left: -60px; }
  .sk-story-list > :nth-child(odd) .sk-polaroid { transform: rotate(16deg); }
  .sk-story-list > :nth-child(odd) .sk-story-text { transform: rotate(-18deg); }
  .sk-story-list > :nth-child(even) .sk-polaroid { order: 2; transform: rotate(-16deg); }
  .sk-story-list > :nth-child(even) .sk-story-text { order: 1; transform: rotate(18deg); margin: 0 -60px 0 0; }
  .sk-story-text .sk-orn { width: 280px; max-width: 100%; height: 56px; color: #c9a3cf; display: block; margin: 0 auto; }
  .sk-story-text .sk-orn + h3 { margin-top: 20px; }
  .sk-story-text h3 { font-family: 'Allura', cursive; font-size: 54px; line-height: 1; }
  .sk-story-text .sk-when { color: #c9a3cf; font-size: 18px; margin: 12px 0 14px; display: block; }
  .sk-story-text p { margin: 0 0 24px; font-size: 16px; }
  .sk-clip { position: absolute; left: 50%; top: -24px; width: 22px; height: 60px; color: #c9a58f; z-index: 3; transform: translateX(-50%); }

  /* Gallery */
  .sk-gallery { display: grid; grid-template-columns: .72fr 1fr 1fr 1fr .72fr; grid-template-rows: auto auto; gap: 30px 22px; max-width: 1280px; margin: 0 auto; align-items: center; }
  .sk-gal { display: block; background: #fff; padding: 14px; box-shadow: 0 8px 30px rgba(90,70,110,.12); overflow: hidden; }
  .sk-gal img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .sk-gal:hover img { transform: scale(1.06); }
  .sk-gal-box { aspect-ratio: 264 / 300; }
  .sk-gal-ol { grid-column: 1; grid-row: 1 / span 2; }
  .sk-gal-or { grid-column: 5; grid-row: 1 / span 2; }
  .sk-gal-oval { aspect-ratio: 190 / 330; border-radius: 999px; }
  .sk-gal-oval img { border-radius: 999px; }
  .sk-gal-archt { border-radius: 999px 999px 0 0; }

  <script>
  
  (() => {
    const cd = document.querySelector('.sk-count');
    const target = Number(cd.dataset.ts) * 1000;
    const tick = () => {
      const t = Math.max(0, target - Date.now()) / 1000;
      const v = { d: Math.floor(t / 86400), h: Math.floor(t / 3600) % 24, m: Math.floor(t / 60) % 60, s: Math.floor(t) % 60 };
      for (const k in v) cd.querySelector(`[data-u="${k}"]`).textContent = String(v[k]).padStart(2, '0');
    };
    tick();
    setInterval(tick, 1000);

    const header = document.getElementById('sk-header');
    addEventListener('scroll', () => header.classList.toggle('sk-stuck', scrollY > 10), { passive: true });
    document.querySelectorAll('.sk-nav a').forEach((a) => a.addEventListener('click', () => { document.getElementById('sk-menu').checked = false; }));

    const box = document.getElementById('sk-lightbox');
    if (box) {
      document.querySelectorAll('[data-lightbox]').forEach((a) => a.addEventListener('click', (e) => {
        e.preventDefault();
        // show the already-loaded thumbnail at once (never the previous photo), then swap in the full size when it arrives
        const img = box.querySelector('img'), thumb = a.querySelector('img');
        img.src = thumb ? thumb.currentSrc || thumb.src : a.href;
        img.dataset.want = a.href;
        const full = new Image();
        full.onload = () => { if (img.dataset.want === a.href) img.src = a.href; };
        full.src = a.href;
        box.showModal();
      }));
      box.addEventListener('click', () => box.close());
    }

    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('sk-in'); io.unobserve(e.target); }
    }), { threshold: 0.12 });
    document.querySelectorAll('.sk-reveal').forEach((el) => io.observe(el));
  })();

  </script>
