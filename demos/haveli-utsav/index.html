<style>
@font-face{font-family:Rungkut;src:url(fonts/rungkut-400.woff2) format("woff2");font-display:block}
@font-face{font-family:"Hello Bride";src:url(fonts/hello-bride-400.woff2) format("woff2");font-display:block}

@font-face{font-family:Corm;src:url(fonts/cormorant-var.woff2) format("woff2");font-weight:300 700;font-display:swap}

:root{
  --paper:#fbf9f5; --ink:#433c2a; --soft:#625a46; --olive:#848b49; --sage:#c4cbaf; --sage-d:#5f6b40;
  --rose:#a14f64; --gold:#a8843f; --gold-l:#e3c992;
  --col:min(100vw,480px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:#e6e9dc}
body{font-family:Corm,Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:100%}
a{color:inherit}
.page{position:relative;width:var(--col);margin:0 auto;background:var(--paper);container-type:inline-size;overflow:hidden;box-shadow:0 0 70px rgba(67,60,42,.13);--u:1cqw}
.fb{font-family:Corm,serif;text-transform:uppercase;font-weight:500;font-size:1.04em;position:relative;top:-.06em}.fb.sm{font-size:.72em;top:-.1em}

/* ---------------- the curtain (same clip, same name timing as Phulkari) ---------------- */
.intro{position:fixed;top:0;left:50%;width:var(--col);height:100svh;z-index:60;overflow:hidden;background:#c4cbaf;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transform:translateX(-50%) scale(1);
  transition:opacity 1.2s cubic-bezier(.45,.05,.25,1),transform 1.2s cubic-bezier(.45,.05,.25,1)}
.intro.done{opacity:0;transform:translateX(-50%) scale(1.035);pointer-events:none}
.intro.playing{cursor:default}
.intro video,.intro .poster,.intro .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.intro video{z-index:1}.intro .poster{z-index:2}.intro .still{z-index:1;opacity:0;transition:opacity .9s}
.intro.novideo .still{opacity:1}.intro.novideo .poster{opacity:0;transition:opacity .9s}

.names{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;color:var(--olive);font-family:Rungkut,Corm,serif}
.names .nm{position:absolute;left:50%;width:max-content;white-space:nowrap;line-height:1.15;font-weight:400;transform:translateX(-50%)}
.nm0{top:38.5%}.nm1{top:47.2%}.nm2{top:54%}
.intro .nm{opacity:0}
.intro.novideo .nm{transition:opacity .5s,filter .5s}

.hint{position:absolute;left:0;right:0;bottom:max(13%,calc(env(safe-area-inset-bottom,0px) + 34px));z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .42s,transform .42s}
.hint.on{opacity:1;transform:none}
.mark{position:relative;width:84px;height:84px}
.mark:before,.mark:after,.core{content:"";position:absolute;left:50%;top:50%;border-radius:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2)}
.mark:before,.mark:after{--s:72px;border:3.5px solid #fbf7ef;box-shadow:0 0 11px rgba(201,163,92,.55),inset 0 0 7px rgba(201,163,92,.3);opacity:0;transform:scale(.3);animation:ring 2.2s cubic-bezier(.33,1,.68,1) infinite}
.mark:after{animation-delay:.3s}
.core{--s:16px;background:radial-gradient(circle at 50% 42%,#fffdf7 0,#fbf7ef 52%,rgba(201,163,92,.55) 100%);box-shadow:0 0 6px rgba(255,250,235,.7),0 0 12px rgba(201,163,92,.55);animation:beat 2.2s cubic-bezier(.33,1,.68,1) infinite}
@keyframes ring{0%{opacity:0;transform:scale(.3)}6%{opacity:1}32%,100%{opacity:0;transform:scale(1.16)}}
@keyframes beat{0%{transform:scale(1)}4%{transform:scale(1.26)}11%{transform:scale(1)}18%{transform:scale(1.22)}26%,100%{transform:scale(1)}}
.chip{width:max-content;max-width:min(84%,330px);padding:7px 15px 8px;border-radius:999px;background:rgba(30,25,19,.62);box-shadow:inset 0 0 0 1px rgba(232,210,162,.46),0 4px 12px rgba(28,23,17,.34);
  color:#fbf7ef;font:400 13.5px/1.3 Georgia,serif;font-variant:small-caps;letter-spacing:.11em;text-indent:.11em;text-align:center}

/* ---------------- hero: the curtain's last frame simply stays and becomes the page ---------------- */
.hero{position:relative;height:100svh;overflow:hidden;background:#e6eef1}
.hero .sky{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(rgba(251,249,245,0),var(--paper));pointer-events:none}
.hx{position:absolute;left:50%;transform:translate(-50%,14px);text-align:center;opacity:0;transition:opacity 1.5s ease,transform 1.5s cubic-bezier(.2,.7,.2,1)}
.open .hx{opacity:1;transform:translate(-50%,0)}
/* Ganesh ji and the mantra sit in the open sky above the names, on every screen size */
.hx-top{position:absolute;left:0;right:0;top:var(--tt,6%);height:var(--th,30%);z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;pointer-events:none}
.hxf{opacity:0;transform:translateY(14px);transition:opacity 1.5s ease,transform 1.5s cubic-bezier(.2,.7,.2,1)}
.open .hxf{opacity:1;transform:none}
.hx-ganesh{height:min(60%,calc(var(--a)*190));width:auto;max-width:none;transition-delay:.25s}
.hx-mantra{flex:none;width:calc(var(--a)*290);height:min(17%,calc(var(--a)*72));background:linear-gradient(100deg,#8a6a2c,#c9a35c 45%,#8a6a2c);
  -webkit-mask:url(assets/ganeshay.webp) center/contain no-repeat;mask:url(assets/ganeshay.webp) center/contain no-repeat;transition-delay:.55s}
.hx-rule{top:64.5%;width:44%;transition-delay:.9s}
.hx-date{top:67.6%;width:92%;font:500 calc(var(--a)*25)/1.3 Cinzel,serif;letter-spacing:.2em;text-indent:.2em;color:var(--ink);transition-delay:1.1s}
.hx-place{top:71.2%;width:90%;font:italic 500 calc(var(--a)*33)/1.3 Corm,serif;color:var(--soft);transition-delay:1.25s}
.hx-cue{top:85%;font:500 calc(var(--a)*17)/1 Cinzel,serif;letter-spacing:.32em;text-indent:.32em;color:var(--sage-d);transition-delay:1.8s;text-transform:uppercase}
.hx-cue i{display:block;width:1px;height:calc(var(--a)*70);margin:12px auto 0;background:linear-gradient(var(--sage-d),rgba(95,107,64,0));transform-origin:top;animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

/* ---------------- shared ---------------- */
.sec{position:relative;padding:calc(13*var(--u)) calc(8*var(--u));text-align:center}
.eyebrow{font:500 calc(3.05*var(--u))/1.4 Cinzel,serif;letter-spacing:.3em;text-indent:.3em;color:var(--sage-d);text-transform:uppercase}
.script{font:400 calc(12*var(--u))/1.15 "Hello Bride",Pinyon,cursive;color:var(--rose);margin:calc(2*var(--u)) 0 calc(5*var(--u))}
.body{font-size:calc(4.75*var(--u));line-height:1.55;color:var(--ink)}
.body i,.it{font-style:italic;color:var(--soft)}
.lotus-rule{display:flex;align-items:center;justify-content:center;gap:calc(3*var(--u));margin:calc(5*var(--u)) auto}
.lotus-rule:before,.lotus-rule:after{content:"";height:1px;width:calc(20*var(--u));background:linear-gradient(90deg,rgba(168,132,63,0),var(--gold))}
.lotus-rule:after{transform:scaleX(-1)}
.lotus-rule img{width:calc(11*var(--u))}
.btn{display:inline-block;padding:calc(3.2*var(--u)) calc(7*var(--u));border-radius:999px;border:1px solid var(--gold);font:600 calc(3.1*var(--u))/1 Cinzel,serif;letter-spacing:.16em;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.5);text-transform:uppercase}
.btn.solid{background:linear-gradient(135deg,#6f7a4e,#535e36);border-color:#535e36;color:#fbf7ef}

.rv{opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.write{clip-path:inset(-30% 100% -30% -10%);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),clip-path 1.8s cubic-bezier(.45,.05,.35,1) .15s}
.write.in{clip-path:inset(-30% -10% -30% -10%)}

/* ---------------- invitation ---------------- */
.invite{padding-top:calc(6*var(--u));background:radial-gradient(70% 30% at 0% 30%,rgba(196,203,175,.28),transparent 70%),radial-gradient(60% 28% at 100% 75%,rgba(236,200,200,.26),transparent 70%)}
.invite .kalash{width:calc(34*var(--u));margin:0 auto calc(4*var(--u))}
.elders{font-size:calc(4.5*var(--u));line-height:1.5;margin-top:calc(2.5*var(--u));color:var(--ink)}
.parents{font-weight:600;font-size:calc(5*var(--u));letter-spacing:.02em}
.who{font:400 calc(16*var(--u))/1.1 "Hello Bride",Pinyon,cursive;color:var(--rose);margin:calc(4*var(--u)) 0 calc(1*var(--u))}
.with{font:italic 500 calc(5*var(--u))/1 Corm,serif;color:var(--gold);margin:calc(1*var(--u)) 0}

/* ---------------- our story: couple in the garden arch ---------------- */
.story{background:linear-gradient(var(--paper),#f3f4ec 40%,var(--paper))}
.archwrap{position:relative;width:calc(74*var(--u));margin:calc(4*var(--u)) auto 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.archwrap .rose{position:absolute;z-index:2;left:-9%;width:118%;max-width:none;top:-6%;pointer-events:none}
.archframe{padding:calc(1.1*var(--u));border-radius:50% 50% calc(2*var(--u)) calc(2*var(--u))/34% 34% calc(2*var(--u)) calc(2*var(--u));
  background:linear-gradient(160deg,#e9d39d,#a8843f 40%,#f1dfae 60%,#9c7a37);box-shadow:0 18px 40px rgba(67,60,42,.18)}
.arch{position:relative;aspect-ratio:3/4.15;overflow:hidden;border-radius:50% 50% calc(1.4*var(--u)) calc(1.4*var(--u))/33% 33% calc(1.4*var(--u)) calc(1.4*var(--u))}
.arch .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;max-width:none;transform:scale(1.08);transition:transform 6s ease}
.archwrap.in .arch .bg{transform:scale(1)}
.archwrap.photo .arch .bg{object-position:50% 40%}
.archwrap.photo .couple,.archwrap.photo .shadow{display:none}
.arch .shadow{position:absolute;left:24%;right:24%;bottom:4%;height:6%;border-radius:50%;background:radial-gradient(rgba(60,50,30,.35),rgba(60,50,30,0) 70%)}
.arch .couple{position:absolute;left:50%;bottom:4.5%;width:50%;transform:translate(-50%,10%);opacity:0;transition:transform 1.6s cubic-bezier(.2,.7,.2,1) .5s,opacity 1.6s ease .5s}
.archwrap.in .couple{transform:translate(-50%,0);opacity:1}
.archwrap.pop .couple{animation:pop .7s ease}
@keyframes pop{40%{transform:translate(-50%,-2.5%) scale(1.03)}}
.arch .glow{position:absolute;inset:0;background:radial-gradient(45% 30% at 50% 45%,rgba(255,240,200,.55),transparent 70%);opacity:0;transition:opacity .6s}
.archwrap.pop .glow{opacity:1}
.tapnote{margin:calc(4*var(--u)) auto 0;font:500 calc(2.9*var(--u))/1 Cinzel,serif;letter-spacing:.2em;color:var(--sage-d);display:flex;gap:8px;justify-content:center;align-items:center;text-transform:uppercase}
.tapnote:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(168,132,63,.2);animation:dot 1.8s infinite}
@keyframes dot{50%{box-shadow:0 0 0 8px rgba(168,132,63,0)}}
.story .body{margin-top:calc(6*var(--u))}

/* ---------------- countdown in the hanging lanterns ---------------- */
.count{padding-bottom:calc(10*var(--u))}
.lanterns{position:relative;width:calc(100*var(--u));margin:calc(2*var(--u)) calc(-8*var(--u)) 0}
.lanterns .cd{position:absolute;top:60%;width:15%;transform:translate(-50%,-50%);text-align:center;color:var(--ink)}
.cd b{display:block;font:600 calc(7.4*var(--u))/1 Corm,serif;color:#3d4a6e}
.cd small{display:block;margin-top:calc(1.2*var(--u));font:600 calc(2.3*var(--u))/1 Cinzel,serif;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.count .body{margin-top:calc(3*var(--u))}

/* ---------------- events on a golden thread ---------------- */
.events{background:radial-gradient(80% 22% at 100% 18%,rgba(196,203,175,.3),transparent 70%),radial-gradient(80% 22% at 0% 62%,rgba(236,200,200,.25),transparent 70%)}
.evlist{position:relative;margin-top:calc(4*var(--u))}
.thread{position:absolute;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(rgba(168,132,63,.45) 0 6px,transparent 6px 12px)}
.thread i{position:absolute;left:0;top:0;width:2px;background:linear-gradient(var(--gold-l),var(--gold));box-shadow:0 0 6px rgba(227,201,146,.9)}
.thread img{position:absolute;left:50%;top:0;width:calc(11*var(--u));max-width:none;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 6px rgba(168,132,63,.4))}
.ev{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:calc(10*var(--u));align-items:center;padding:calc(5*var(--u)) 0}
.ev .pic{position:relative;opacity:.35;transform:scale(.86);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.ev .pic:before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(rgba(255,236,190,.95),rgba(255,236,190,0) 68%);opacity:0;transition:opacity .9s}
.ev .pic img{position:relative}
.ev .pic.narrow img{width:74%;margin:0 auto}
.ev .txt{text-align:left;opacity:0;transform:translateX(12px);transition:opacity .9s .15s,transform .9s cubic-bezier(.2,.7,.2,1) .15s}
.ev:nth-child(odd of .ev) .pic{order:2}
.ev:nth-child(odd of .ev) .txt{order:1;text-align:right;transform:translateX(-12px)}
.ev.on .pic{opacity:1;transform:none}.ev.on .pic:before{opacity:1}
.ev.on .txt{opacity:1;transform:none}
.ev h3{font:400 calc(9.6*var(--u))/1.1 "Hello Bride",Pinyon,cursive;color:var(--rose)}
.ev .when{margin-top:calc(1.5*var(--u));font:600 calc(3.05*var(--u))/1.45 Cinzel,serif;letter-spacing:.09em;color:var(--ink);white-space:pre-line}
.ev .where{margin-top:calc(1*var(--u));font:italic 500 calc(4.3*var(--u))/1.3 Corm,serif;color:var(--soft)}
.ev .note{margin-top:calc(1*var(--u));font-size:calc(3.9*var(--u));line-height:1.35;color:var(--soft)}
.ev a{display:inline-block;margin-top:calc(2*var(--u));font:600 calc(2.7*var(--u))/1 Cinzel,serif;letter-spacing:.16em;color:var(--sage-d);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:3px;text-transform:uppercase}

/* ---------------- venue: little painted landscape in an arch ---------------- */
.venue{background:linear-gradient(var(--paper),#f2efe6 55%,var(--paper))}
.vframe{width:calc(80*var(--u));margin:calc(2*var(--u)) auto 0;padding:calc(1*var(--u));border-radius:50% 50% calc(2*var(--u)) calc(2*var(--u))/40% 40% calc(2*var(--u)) calc(2*var(--u));
  background:linear-gradient(160deg,#e9d39d,#a8843f 40%,#f1dfae 60%,#9c7a37);box-shadow:0 16px 36px rgba(67,60,42,.16)}
.vwin{position:relative;aspect-ratio:1/.9;overflow:hidden;border-radius:50% 50% calc(1.4*var(--u)) calc(1.4*var(--u))/39% 39% calc(1.4*var(--u)) calc(1.4*var(--u));
  background:linear-gradient(#f6dcd6 0,#fbeee4 38%,#f3efe2 60%)}
.vwin .sun{position:absolute;left:50%;top:30%;width:34%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(#fff6e2,rgba(255,240,210,0) 70%)}
.vwin .hills{position:absolute;left:-6%;width:112%;max-width:none;bottom:20%;transform:translateY(14%);transition:transform 2.4s cubic-bezier(.2,.7,.2,1)}
.vwin .palace{position:absolute;left:-4%;width:108%;max-width:none;bottom:-3%;transform:translateY(10%);transition:transform 2.4s cubic-bezier(.2,.7,.2,1) .2s}
.vframe.in .hills,.vframe.in .palace{transform:none}
.vwin .vp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.vwin.photo>*:not(.vp){display:none}
.vname{margin-top:calc(7*var(--u));font:600 calc(7.4*var(--u))/1.15 Corm,serif;color:var(--ink);letter-spacing:.01em}
.venue .body{margin:calc(1.5*var(--u)) 0 calc(6*var(--u))}

/* ---------------- our moments (only when photos are added) ---------------- */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:calc(4*var(--u));margin-top:calc(2*var(--u))}
.gal .ph{padding:calc(.9*var(--u));background:linear-gradient(160deg,#e9d39d,#a8843f 40%,#f1dfae 60%,#9c7a37);border-radius:50% 50% calc(1.6*var(--u)) calc(1.6*var(--u))/26% 26% calc(1.6*var(--u)) calc(1.6*var(--u));box-shadow:0 10px 22px rgba(67,60,42,.14)}
.gal .ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:50% 50% calc(1.2*var(--u)) calc(1.2*var(--u))/25% 25% calc(1.2*var(--u)) calc(1.2*var(--u))}
.gal .ph:first-child{grid-column:1/-1}
.gal .ph:first-child img{aspect-ratio:4/3.6}

/* ---------------- reply card ---------------- */
.rsvp{padding-top:calc(16*var(--u));padding-bottom:calc(16*var(--u))}
.rsvp .peacock{position:absolute;left:calc(-5*var(--u));bottom:calc(-6*var(--u));transform:scaleX(-1);width:calc(22*var(--u));max-width:none;opacity:.9;pointer-events:none}
.rsvp .body{max-width:calc(72*var(--u));margin:0 auto}
#rsvp{position:relative;max-width:calc(76*var(--u));margin:calc(7*var(--u)) auto 0;text-align:left;display:grid;gap:calc(4.5*var(--u))}
#rsvp .l{display:block;font:600 calc(2.8*var(--u))/1.3 Cinzel,serif;letter-spacing:.14em;color:var(--sage-d);text-transform:uppercase;margin-bottom:calc(1.6*var(--u))}
#rsvp input:not([type=radio]),#rsvp select,#rsvp textarea{width:100%;font:500 calc(4.6*var(--u))/1.3 Corm,serif;color:var(--ink);padding:calc(2.6*var(--u)) calc(3.4*var(--u));border:1px solid rgba(168,132,63,.55);border-radius:calc(2.4*var(--u));background:rgba(255,255,255,.75);outline:none;-webkit-appearance:none;appearance:none}
#rsvp textarea{resize:vertical}
.choice{display:flex;gap:calc(2.5*var(--u))}
.choice label{flex:1;position:relative;cursor:pointer}
.choice input{position:absolute;opacity:0;inset:0;margin:0}
.choice span{display:block;text-align:center;padding:calc(2.8*var(--u)) calc(2*var(--u));border:1px solid rgba(168,132,63,.55);border-radius:999px;font:500 calc(4.2*var(--u))/1.2 Corm,serif;background:rgba(255,255,255,.6)}
.choice input:checked+span{background:var(--sage-d);border-color:var(--sage-d);color:#fbf7ef}
#rsvp .btn{justify-self:center;margin-top:calc(2*var(--u));cursor:pointer}
.thanks{display:none;margin-top:calc(8*var(--u))}
.thanks b{display:block;font:400 calc(11*var(--u))/1.1 "Hello Bride",Pinyon,cursive;color:var(--rose);margin-bottom:calc(2*var(--u))}

/* ---------------- closing ---------------- */
.close{padding-top:calc(6*var(--u));padding-bottom:calc(6*var(--u));background:linear-gradient(var(--paper),#f1f2e9)}
.close .rangoli{width:calc(46*var(--u));margin:0 auto calc(7*var(--u))}
.close .rangoli.in{animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.endnames{font:400 calc(13*var(--u))/1.12 Rungkut,Corm,serif;color:var(--olive);margin:calc(3*var(--u)) 0 calc(4*var(--u))}
