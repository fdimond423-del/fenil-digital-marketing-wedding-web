<style>
  body { margin: 0; }
  .nl { --nl-blue: #8EAEBA; --nl-slate: #34505c; --nl-text: #73777b; --nl-soft: #f9f9f9; --nl-light: #9ebac4;
    background: #fff; color: var(--nl-text); font: 300 15px/24px 'Poppins', sans-serif; overflow-x: clip; font-feature-settings: 'lnum' 1; }
  .nl *, .nl *::before, .nl *::after { box-sizing: border-box; }
  .nl h1, .nl h2, .nl h3, .nl h4, .nl h5, .nl p { margin: 0; }
  .nl h1, .nl h2, .nl h3, .nl h4, .nl h5 { font-family: 'Playfair Display', serif; font-weight: 500; }
  .nl a { color: inherit; text-decoration: none; }
  .nl img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .nl-wrap { max-width: 1296px; margin: 0 auto; padding: 0 24px; }
  .nl-ph { width: 100%; height: 100%; background: #dfe8ec; }

  /* Double offset frame (buttons, year boxes, cards) */
  .nl-frame { position: relative; }
  .nl-frame::before, .nl-frame::after { content: ''; position: absolute; border: 1px solid currentColor; pointer-events: none; }
  .nl-frame::before { inset: -7px 7px; }
  .nl-frame::after { inset: 0 -7px; }
  .nl .nl-btn { display: inline-block; color: var(--nl-blue); font: 400 16px/1 'Playfair Display', serif; letter-spacing: .1em; text-transform: uppercase; padding: 16px 40px; transition: color .3s, background .3s; }
  .nl .nl-btn:hover { color: #fff; background: var(--nl-blue); }
  .nl-btn svg { width: 17px; height: 17px; vertical-align: -3px; margin-right: 8px; }

  .nl-divider { display: flex; align-items: center; justify-content: center; gap: 6px; color: currentColor; }
  .nl-divider i { width: 69px; height: 1px; background: currentColor; opacity: .8; }
  .nl-divider svg { width: 44px; height: 20px; }
  .nl-title { text-align: center; color: var(--nl-blue); margin-bottom: 70px; }
  .nl-title h2 { font-size: 56px; line-height: 1.2; margin-bottom: 8px; }
  .nl .nl-title.nl-light, .nl-title.nl-light h2 { color: #fff; }

  /* Header */
  .nl-header { position: sticky; top: 0; z-index: 50; background: #fff; height: 70px; box-shadow: 0 1px 12px rgba(0,0,0,.05); }
  .nl-header .nl-wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; max-width: 1344px; }
  .nl .nl-logo { font: 400 44px/1 'Mrs Saint Delafield', cursive; color: var(--nl-blue); white-space: nowrap; padding-top: 10px; }
  .nl-nav { display: flex; }
  .nl-nav a { font: 400 16px/70px 'Playfair Display', serif; text-transform: uppercase; padding: 0 22px; color: var(--nl-text); transition: color .3s; }
  .nl-nav a:hover, .nl-nav a:first-child { color: var(--nl-blue); }
  .nl-menu-toggle { display: none; }

  .nl-menu-btn i { display: block; height: 3px; background: #fff; border-radius: 2px; }

  /* Hero */
  .nl-hero { position: relative; height: 830px; color: #fff; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); }

  .nl-bg::after { content: ''; position: absolute; inset: 0; background: rgba(52, 80, 92, .78); }
  .nl-wreath { position: absolute; top: 88px; width: 290px; height: 510px; color: var(--nl-blue); fill: none; stroke: currentColor; stroke-width: 1.7; z-index: 1; }
  .nl-wreath-l { left: 6%; }
  .nl-wreath-r { right: 6%; transform: scaleX(-1); }
  .nl-hero-in { position: relative; z-index: 2; padding-top: 140px; }

  .nl-hero h1 { font-size: 99px; line-height: 1; margin: 22px 0 36px; }

  .nl-hero-rule { width: 100px; height: 1px; background: #fff; margin: 0 auto 38px; }
  .nl-hero-date { display: flex; justify-content: center; align-items: center; gap: 22px; font: 400 24px/1 'Poppins', sans-serif; text-transform: uppercase; }
  .nl-hero-date b { font: 400 68px/1 'Playfair Display', serif; }
  .nl .nl-hero .nl-btn { margin-top: 56px; }

  /* Couple */
  .nl-couple { position: relative; z-index: 3; margin-top: -140px; text-align: center; padding-bottom: 110px; }

  .nl-person { position: relative; width: 416px; aspect-ratio: 1; background: #fff; padding: 15px; }
  .nl-person-cap { position: absolute; inset: 15px; background: rgba(255,255,255,.93); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; opacity: 0; transition: opacity .4s; }
  .nl-person:hover .nl-person-cap, .nl-person:focus-within .nl-person-cap { opacity: 1; }
  .nl-person-cap h3 { font-size: 40px; line-height: 48px; color: var(--nl-blue); }

  .nl-person-cap p { margin-top: 12px; }
  .nl .nl-person-cap .wl-social, .nl .nl-foot .wl-social { display: flex; gap: 14px; list-style: none; padding: 0; margin: 14px 0 0; justify-content: center; color: var(--nl-blue); }
  .nl-heart { width: 104px; height: 104px; margin: -52px auto 0; position: relative; z-index: 2; background: #fff; border-radius: 50%; display: grid; place-items: center; color: var(--nl-blue); }
  .nl-heart svg { width: 62px; height: 62px; }
  .nl-couple h3.nl-we { font-size: 26px; line-height: 1.2; color: var(--nl-blue); margin-top: 16px; }
  .nl-couple h3.nl-we b { display: block; font-size: 40px; line-height: 48px; font-weight: 700; }
  .nl-couple p.nl-lead { max-width: 856px; margin: 40px auto 0; }
  .nl-sign { font: 400 56px/1 'Mrs Saint Delafield', cursive; color: #2c2c2c; margin-top: 30px; }

  /* Love story banner & slanted photo bands */
  .nl-band { position: relative; color: #fff; text-align: center; }
  .nl-band > .nl-bg img, .nl-hero > .nl-bg img { position: absolute; inset: 0; }
  .nl-story-band { height: 442px; clip-path: polygon(0 29.6%, 100% 0, 100% 100%, 0 65.8%); }
