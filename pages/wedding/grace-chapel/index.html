<style>
/* Grace Chapel: navy, hydrangea blue, ivory roses and gold, for church weddings.
   It opens from a lace envelope sealed in gold, then reads top to bottom:
   names, a verse, the countdown, the order of the day, the church and the reception,
   pictures, what to wear, the reply card and a blessing. */
:root{
  --navy:#14213d; --navy-2:#1d2d52; --blue:#7f9cc9; --blue-l:#d9e3f2; --blush:#f2d4d0; --rose:#c8727e;
  --gold:#c9a45c; --gold-l:#ead7ac; --ivory:#fbf6ee; --cream:#f4ecdf; --ink:#24283a; --soft:#5f6377;
  --script:'Pinyon Script',cursive; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:100%}
.wrap{max-width:520px;margin:0 auto;position:relative;background:var(--ivory);overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.4)}
.sec{padding:90px 26px;text-align:center;position:relative}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--rose)}
h2.title{font-family:var(--script);font-weight:400;font-size:clamp(48px,13vw,62px);line-height:1.1;color:var(--navy);margin:10px 0 6px}
.lead{color:var(--soft);font-style:italic;font-size:19px;max-width:360px;margin:0 auto}
.rule{display:flex;align-items:center;gap:12px;justify-content:center;margin:18px auto;color:var(--gold)}
.rule:before,.rule:after{content:"";height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.dark{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:var(--ivory)}
.dark h2.title{color:var(--gold-l)}
.dark .eyebrow{color:var(--gold)}
.dark .lead{color:#c9d2e6}
.blush{background:linear-gradient(180deg,#fdf1ee,var(--blush))}
/* flower pictures that sit in the corners of a section */
.corner{position:absolute;pointer-events:none;width:40%;max-width:200px;z-index:0}
.corner.tl{top:-10px;left:-34px;transform:scaleX(-1) rotate(8deg)}
.corner.tr{top:-10px;right:-34px;transform:rotate(-8deg)}
.corner.bl{bottom:-40px;left:-40px;transform:scale(-1,-1)}
.corner.br{bottom:-50px;right:-46px;transform:scaleY(-1)}
.sec>*:not(.corner){position:relative;z-index:1}
/* things rise into place as they scroll in */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.rv.in{opacity:1;transform:none}

/* ---------- falling petals ---------- */
#petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#petals i{position:absolute;top:-40px;width:18px;height:22px;background:url(assets/petal.webp) center/contain no-repeat;filter:hue-rotate(-12deg) saturate(.55) brightness(1.35);opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ---------- the lace envelope ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;
  background:radial-gradient(110% 70% at 50% 40%,var(--navy-2) 0%,var(--navy) 70%,#0c1528 100%);transition:opacity 1s ease 3.4s,visibility 0s 4.5s}
#gate:before{content:"";position:absolute;inset:0;background:url(assets/floral-corner.webp) left -60px top -50px/58% no-repeat,url(assets/floral-corner.webp) right -60px bottom -50px/58% no-repeat;opacity:.9;transform:scaleX(-1)}
#gate.open{opacity:0;visibility:hidden}
.env{position:relative;width:min(82vw,360px);aspect-ratio:1050/1155;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));transition:transform 1.3s cubic-bezier(.5,0,.2,1) 2.6s}
.env img{position:absolute;inset:0;width:100%;height:100%}
.env .letter{position:absolute;left:18%;right:19%;top:9%;height:52%;background:linear-gradient(#fffdf8,#f6eee0);border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px;transition:transform 1.2s cubic-bezier(.3,.8,.3,1) .5s}
.env .letter>span{font-family:var(--sans);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.env .letter b{font-family:var(--script);font-weight:400;font-size:clamp(28px,8vw,36px);line-height:1.1;color:var(--navy)}
.env .seal{position:absolute;left:50%;top:60%;width:30%;height:auto;transform:translate(-50%,-50%);transition:transform .6s ease,opacity .6s ease;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
.gate-hint{margin-top:30px;position:relative;font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-l);animation:breathe 2.4s ease-in-out infinite}
.gate-top{position:relative;margin-bottom:26px;font-family:var(--script);font-size:34px;color:var(--gold-l)}
@keyframes breathe{50%{opacity:.4}}
#gate.open .gate-hint{animation:none;opacity:0;transition:opacity .4s}
#gate.open .seal{animation:none;opacity:0;transform:translate(-50%,-50%) scale(1.5)}
#gate.open .letter{transform:translateY(-38%)}
#gate.open .env{transform:scale(1.18) translateY(6%)}

/* ---------- hero: names inside the flower frame ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 46px;text-align:center;position:relative;color:var(--ivory);
  background:url(assets/navy-frame.webp) center/100% 100% no-repeat,var(--navy)}
.hero .cross{width:26px;height:38px;margin:0 auto 18px;position:relative}
.hero .cross:before,.hero .cross:after{content:"";position:absolute;background:linear-gradient(var(--gold-l),var(--gold));border-radius:2px}
.hero .cross:before{left:11px;top:0;width:4px;height:38px}
.hero .cross:after{left:2px;top:9px;width:22px;height:4px}
.together{font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--blue-l)}
.names{font-family:var(--script);font-weight:400;line-height:1;margin:16px 0 4px;color:var(--gold-l);text-shadow:0 2px 18px rgba(201,164,92,.35)}
.names .n{display:block;font-size:clamp(62px,18vw,88px)}
.names .amp{display:block;font-family:var(--serif);font-style:italic;font-size:28px;color:var(--blush);margin:6px 0}
.parents{display:flex;justify-content:center;gap:22px;width:100%;max-width:420px;margin:16px auto 2px}
.parents>div{flex:1;min-width:0}
.parents>div+div{border-left:1px solid rgba(201,164,92,.4);padding-left:22px}
.parents.one>div+div{border:0;padding:0}
.parents span{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--blue-l);margin-bottom:6px}
.parents b{display:block;font-weight:500;font-size:17px;line-height:1.35;color:var(--gold-l)}
.invite-line{font-style:italic;color:#d4dbeb;font-size:18px;margin-top:12px}
.date-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;font-family:var(--sans);text-transform:uppercase}
.date-row .side{font-size:11px;letter-spacing:.28em;padding:8px 0;border-top:1px solid rgba(234,215,172,.5);border-bottom:1px solid rgba(234,215,172,.5);min-width:80px;color:var(--blue-l)}
.date-row .day{font-family:var(--serif);font-size:56px;line-height:1;color:var(--gold-l)}
.scroll-cue{margin-top:34px;font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.scroll-cue:after{content:"";display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(var(--gold),transparent);animation:drop 2s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- verse ---------- */
.verse .lily{width:150px;margin:0 auto 8px;filter:drop-shadow(0 12px 18px rgba(200,114,126,.25))}
.verse blockquote{font-size:clamp(22px,6.2vw,27px);font-style:italic;line-height:1.5;color:var(--navy);max-width:420px;margin:14px auto 0}
.verse cite{display:block;margin-top:16px;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose)}

/* ---------- countdown ---------- */
.count-card{max-width:400px;margin:26px auto 0;padding:46px 22px 36px;background:url(assets/count-card.webp) center/cover;border-radius:6px;box-shadow:0 24px 50px -16px rgba(0,0,0,.55);color:var(--ink)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.count b{display:block;font-size:40px;font-weight:500;line-height:1;color:var(--navy)}
.count span{font-family:var(--sans);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose)}
.count-date{margin-top:20px;font-style:italic;color:var(--soft);font-size:17px}

/* ---------- order of the day ---------- */
.timeline{list-style:none;max-width:400px;margin:34px auto 0;display:grid;gap:14px;text-align:left}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:16px;align-items:center;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px -14px rgba(20,33,61,.35);border-left:4px solid var(--blue)}
.timeline li:nth-child(2){border-color:var(--rose)}
.timeline li:nth-child(3){border-color:var(--gold)}
.timeline li:nth-child(4){border-color:var(--navy)}
.timeline .ic{width:62px;height:62px;border-radius:50%;background:var(--blue-l);display:flex;align-items:center;justify-content:center}
.timeline li:nth-child(2) .ic{background:var(--blush)}
.timeline li:nth-child(3) .ic{background:#f5e9cc}
.timeline .ic svg{width:30px;height:30px;stroke:var(--navy);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.timeline .t{font-family:var(--sans);font-size:12px;letter-spacing:.2em;color:var(--rose);text-transform:uppercase}
.timeline h3{font-size:23px;font-weight:600;line-height:1.2;margin:2px 0;color:var(--navy)}
.timeline p{color:var(--soft);font-size:15px;line-height:1.4}

/* ---------- church and reception ---------- */
.places{display:grid;gap:22px;margin-top:30px}
.place{background:#fff;border-radius:200px 200px 22px 22px;padding:30px 22px 28px;position:relative;box-shadow:0 22px 44px -22px rgba(0,0,0,.6)}
.place .pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:180px 180px 10px 10px;margin-bottom:18px;background:var(--blue-l)}
.place .pic.sketch{object-fit:contain;background:linear-gradient(var(--blue-l),#fff);padding:18px 10px 0}
.place .eyebrow{color:var(--rose)}
.place h3{font-size:28px;font-weight:600;line-height:1.15;color:var(--navy);margin-top:4px}
.place .when{font-family:var(--sans);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:8px 0}
.place p{color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:13px 26px;border-radius:999px;border:0;color:#fff;background:linear-gradient(135deg,var(--navy-2),var(--navy));
  font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 10px 20px -10px rgba(20,33,61,.7)}
.btn.gold{background:linear-gradient(135deg,#d8b874,#b38a42)}
.map{margin-top:22px;border-radius:20px;overflow:hidden;border:4px solid #fff;aspect-ratio:4/3;background:var(--blue-l);box-shadow:0 22px 44px -22px rgba(0,0,0,.6)}
.map iframe{width:100%;height:100%;border:0}

/* ---------- pictures ---------- */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.gallery figure{border-radius:14px;overflow:hidden;background:#fff;padding:6px;box-shadow:0 14px 28px -16px rgba(20,33,61,.45)}
.gallery figure:nth-child(odd){transform:rotate(-2deg)}
.gallery figure:nth-child(even){transform:rotate(2deg) translateY(18px)}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}

/* ---------- what to wear ---------- */
.swatches{display:flex;justify-content:center;gap:12px;margin:24px 0 8px}
.swatches i{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.wear{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.wear div{background:#fff;border-radius:18px;padding:22px 14px;box-shadow:0 10px 24px -14px rgba(20,33,61,.35)}
.wear img{width:70px;height:90px;object-fit:contain;margin:0 auto 6px}
.wear h4{font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);font-weight:500}
.wear p{font-size:16px;color:var(--soft);margin-top:8px;line-height:1.45}

/* ---------- reply card ---------- */
.rsvp form{max-width:410px;margin:28px auto 0;background:url(assets/paper.webp) center/100% 100%;padding:44px 34px 40px;text-align:left;display:grid;gap:16px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.45));position:relative}
.rsvp form .wax{position:absolute;width:78px;right:16px;top:-26px}
.rsvp label{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:6px}
.rsvp input,.rsvp textarea,.rsvp select{width:100%;font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #cdb98f;padding:8px 2px;outline:none}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{position:relative;margin:0;font-family:var(--serif);text-transform:none;letter-spacing:0;color:var(--ink)}
.choice input{position:absolute;inset:0;opacity:0;pointer-events:none}
.choice span{display:block;text-align:center;padding:12px 6px;border:1px solid #cdb98f;border-radius:12px;font-size:16px;cursor:pointer;transition:.25s;background:rgba(255,255,255,.5)}
.choice input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.rsvp .btn{justify-content:center;width:100%;margin-top:6px}
.thanks{display:none;padding:24px 0;text-align:center}
.thanks b{font-family:var(--script);font-weight:400;font-size:48px;color:var(--gold-l);display:block}

/* ---------- blessing ---------- */
.end{padding:90px 26px 150px;text-align:center;position:relative}
.end .photo{width:min(78%,300px);margin:0 auto 26px;border-radius:200px 200px 16px 16px;border:6px solid #fff;box-shadow:0 22px 40px -20px rgba(0,0,0,.55);aspect-ratio:3/4;object-fit:cover}
.end p{font-style:italic;color:var(--soft);max-width:340px;margin:0 auto}
.end .sign{font-family:var(--script);font-size:46px;color:var(--navy);margin-top:16px;font-style:normal}

/* ---------- music ---------- */
#music{position:fixed;right:16px;bottom:16px;z-index:45;width:50px;height:50px;border-radius:50%;border:2px solid var(--gold-l);background:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
#music[hidden]{display:none}
#music svg{width:22px;height:22px;stroke:var(--gold-l);fill:none;stroke-width:1.6}
#music.on svg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#petals{display:none}}

.place .pic[src=""]{display:none}
.gallery:empty{display:none}
</style>

<body class="locked">

<div id="petals" aria-hidden="true"></div>

<!-- the lace envelope -->
<div id="gate" role="button" tabindex="0" aria-label="Open the invitation">
  <p class="gate-top" data-t="inviteTop"></p>
  <div class="env">
    <img src="assets/env-back.webp" alt="">
    <div class="letter"><span data-t="letterTop"></span><b><span data-n="1"></span><br>&amp; <span data-n="2"></span></b><span data-d="short"></span></div>
    <img src="assets/env-front.webp" alt="">
    <img class="seal" src="assets/seal.webp" alt="">
  </div>
  <p class="gate-hint" data-t="tap"></p>
</div>

<main class="wrap">
  <section class="hero" id="sNames">
    <span class="cross rv" aria-hidden="true"></span>
    <p class="together rv" data-t="together"></p>
    <h1 class="names rv"><span class="n" data-n="1"></span><span class="amp" data-t="amp"></span><span class="n" data-n="2"></span></h1>
    <div class="parents rv" id="parents"><div><span data-t="p1Of"></span><b data-t="p1"></b></div><div><span data-t="p2Of"></span><b data-t="p2"></b></div></div>
    <p class="invite-line rv" data-t="invite"></p>
    <div class="date-row rv"><span class="side" data-d="weekday"></span><span class="day" data-d="day"></span><span class="side" data-d="monthYear"></span></div>
    <span class="scroll-cue" data-t="scroll"></span>
  </section>

  <section class="sec verse blush" id="sVerse">
    <img class="corner tl" src="assets/floral-corner.webp" alt="">
    <img class="lily rv" src="assets/lilies.webp" alt="">
    <p class="eyebrow rv" data-t="verseTop"></p>
    <blockquote class="rv" data-t="verse"></blockquote>
    <cite class="rv" data-t="verseRef"></cite>
  </section>

  <section class="sec dark" id="sCount">
    <p class="eyebrow rv" data-t="countTop"></p>
