  <body class="intro-locked">
    <main id="invitation">
      <audio id="backgroundMusic" loop preload="none"></audio>

      <button
        id="musicToggle"
        class="music-toggle"
        type="button"
        aria-label="Play background music"
      >
        <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="musicLabel" data-bind="labels.musicLabel"></span>
      </button>

      <!-- Opening / hero -->
      <section
        id="hero"
        class="hero is-closed"
        role="button"
        tabindex="0"
        aria-label="Tap to open the wedding invitation"
      >
        <video id="introVideo" class="hero-video" muted playsinline preload="metadata">
          <source id="introVideoSource" type="video/mp4" />
        </video>

        <div class="hero-veil"></div>

        <div id="openingMark" class="opening-mark">

          <span class="opening-label" data-bind="labels.openLabel"></span>
          <span class="opening-ripple"></span>
        </div>

        <div class="hero-content">
          <p class="bismillah" lang="hi" data-bind="copy.bismillah"></p>
          <p class="translation" data-bind="copy.bismillahTranslation"></p>

          <div class="hero-divider"><span>✦</span></div>
          <p class="hero-welcome" data-bind="copy.welcomeLine"></p>

          <div class="couple-names">
            <div>
              <h1 id="brideName"></h1>
              <p data-bind="couple.bride.relation"></p>
              <small data-bind="couple.bride.parents"></small>
            </div>

            <span class="name-ampersand" data-bind="copy.joiner"></span>

            <div>
              <h1 id="groomName"></h1>
              <p data-bind="couple.groom.relation"></p>
              <small data-bind="couple.groom.parents"></small>
            </div>
          </div>

          <p class="hero-invitation" data-bind="copy.invitation"></p>
          <p class="hero-closing" data-bind="copy.heroClosing"></p>

        </div>

        <a class="scroll-cue" href="#welcome">
          <span data-bind="labels.scroll"></span>
          <i aria-hidden="true"></i>
        </a>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Welcome -->
      <section id="welcome" class="welcome-section section-pad">
        <div class="section-shell welcome-shell">
          <div class="welcome-copy reveal">
            <h2 data-bind="copy.welcomeTitle"></h2>
            <p data-bind="copy.welcomeBody"></p>
            <div id="welcomeSignature" class="signature"></div>
          </div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Scratch-to-reveal date -->
      <section id="date" class="scratch-section section-pad">
        <div class="section-shell">
          <header class="section-heading reveal">
            <span class="eyebrow" data-bind="labels.scratchEyebrow"></span>
            <h2 id="scratchHeading" data-bind="labels.scratchHeading"></h2>
            <span class="ornament" aria-hidden="true"><i></i></span>
          </header>

          <div class="scratch-frame-shell reveal">
            <img
              src="./assets/images/scratch-frame.webp"
              alt=""
              class="scratch-frame-overlay"
              aria-hidden="true"
            />

            <div id="scratchCard" class="scratch-wrap">
              <div class="date-reveal" aria-live="polite">
                <span class="date-kicker" data-bind="labels.inviteKicker"></span>
                <strong class="date-main" data-bind="wedding.date"></strong>
                <div class="date-day">
                  <span data-bind="wedding.day"></span>
                  <a aria-hidden="true">⬩</a>
                  <span data-bind="wedding.time"></span>
                </div>
              </div>

              <canvas
                id="scratchCanvas"
                class="scratch-canvas"
                role="button"
                tabindex="0"
                aria-label="Scratch to reveal the wedding date. Press Enter to reveal."
              ></canvas>
            </div>
          </div>

          <p id="scratchNote" class="scratch-note reveal" data-bind="labels.scratchNote"></p>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true" hidden>
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Gallery (hidden in the original demo — remove "hidden" here and on the divider above to show it) -->
      <section class="gallery-section section-pad" aria-label="Gallery" hidden>
        <div class="section-shell">
          <header class="section-heading reveal">
            <span class="eyebrow" data-bind="labels.galleryEyebrow"></span>
            <h2 data-bind="labels.galleryTitle"></h2>
            <span class="ornament" aria-hidden="true"><i></i></span>
          </header>

          <div id="galleryFrame" class="gallery-frame reveal">
            <div id="gallerySlides"></div>
            <span class="gallery-corner gallery-corner-a" aria-hidden="true"></span>
            <span class="gallery-corner gallery-corner-b" aria-hidden="true"></span>
          </div>

          <div id="galleryDots" class="gallery-dots reveal" aria-label="Choose gallery image"></div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Countdown -->
      <section class="countdown-section section-pad">
        <div class="section-shell countdown-shell">
          <header class="section-heading reveal">
            <span class="eyebrow" data-bind="labels.countdownEyebrow"></span>
            <h2 data-bind="labels.countdownTitle"></h2>
            <span class="ornament" aria-hidden="true"><i></i></span>
          </header>

          <div class="countdown reveal" aria-label="Wedding countdown">
            <div><strong id="countdownDays">00</strong><span data-bind="labels.days"></span></div>
            <div><strong id="countdownHours">00</strong><span data-bind="labels.hours"></span></div>
            <div><strong id="countdownMinutes">00</strong><span data-bind="labels.minutes"></span></div>
            <div><strong id="countdownSeconds">00</strong><span data-bind="labels.seconds"></span></div>
          </div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Program -->
      <section class="program-section section-pad">
        <div class="section-shell program-shell">
          <header class="section-heading reveal">
            <span class="eyebrow" data-bind="labels.programEyebrow"></span>
            <h2 data-bind="labels.programTitle"></h2>
            <span class="ornament" aria-hidden="true"><i></i></span>
          </header>

          <div id="programTimeline" class="timeline reveal"></div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Venue -->
      <section class="venue-section section-pad">
        <div class="section-shell">
          <div class="venue-card reveal">

            <span class="eyebrow" data-bind="labels.venueEyebrow"></span>

            <div class="venue-divider" aria-hidden="true">
              <span>✦</span>
            </div>

            <h2 data-bind="venue.name"></h2>

              data-bind="labels.mapButton"
              class="venue-map-button"
              target="_blank"
              rel="noreferrer"
            >
            </a>

          </div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Dress code -->
      <section class="dress-section section-pad">
        <div class="section-shell dress-shell">
          <div class="dress-copy reveal">
            <span class="eyebrow" data-bind="labels.dressEyebrow"></span>
            <h2 data-bind="dressCode.title"></h2>
            <p data-bind="dressCode.description"></p>
          </div>

          <div id="dressPalette" class="palette reveal" aria-label="Suggested colour palette"></div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Festivities: Haldi, Baraat (edit preWeddingEvents in config.js) -->
      <section class="events-section section-pad">
        <div class="section-shell">
          <header class="section-heading reveal">
            <span class="eyebrow" data-bind="labels.eventsEyebrow"></span>
            <h2 data-bind="labels.eventsTitle"></h2>
            <span class="ornament" aria-hidden="true"><i></i></span>
          </header>

          <div id="preWeddingEvents" class="event-list reveal"></div>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true" hidden>
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Gifts (hidden in the original demo) -->
      <section class="gifts-section section-pad" hidden>
        <div class="gift-bloom" aria-hidden="true"><i></i><i></i><i></i></div>

        <div class="gift-copy reveal">
          <span class="eyebrow" data-bind="labels.giftsEyebrow"></span>
          <h2 data-bind="labels.giftsTitle"></h2>
          <p><span data-bind="copy.gifts"></span></p>
        </div>
      </section>

      <div class="floral-divider" aria-hidden="true">
        <img src="./assets/images/floral-divider.webp" alt="">
      </div>

      <!-- Closing -->
      <footer class="closing-section">
        <div class="closing-arch reveal">
          <span class="ornament light" aria-hidden="true"><i></i></span>
          <h2 data-bind="copy.closing"></h2>
          <div id="closingNames" class="closing-names"></div>
          <small id="closingDetails"></small>

          <p class="brand-credit">
            Crafted with love by
            <a id="brandCreditLink" target="_blank" rel="noopener noreferrer" data-bind="brand.name"></a>
          </p>
        </div>
      </footer>
    </main>
